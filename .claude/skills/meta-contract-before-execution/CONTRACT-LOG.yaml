# CONTRACT-LOG.yaml
# Instance data for meta-contract-before-execution. Governed by meta-contract-before-execution/SKILL.md.
# Entries are written only at the approval gate — never silently, never for declined proposals.
#
# Schema reference (full details in meta-contract-before-execution/SKILL.md):
#
#   - contract_id: contract-NNN             # sequential, never reused
#     feature: [feature name]
#     date_proposed: YYYY-MM-DD
#     date_approved: YYYY-MM-DD
#     tier_1: |
#       [full user scenario text, as approved]
#     tier_2: |
#       [full use cases text, as approved]
#     tier_3: |
#       [full technical guardrails text, as approved]
#     status: approved | implemented | verified | learned
#     revisions: []                         # authorized mid-run changes only — see below
#     work_id: null                         # populated by meta-learning once a LEARNINGLOG entry exists
#
# Status lifecycle:
#   approved    — set when this entry is created, at the approval gate
#   implemented — set when the Standard Evolution Report is produced
#   verified    — set when verification completes (tests / observation / human confirmation)
#   learned     — set by meta-learning once it has produced the matching LEARNINGLOG.yaml diff
#
# Only approved contracts are logged. Declined or revised-before-approval proposals are not — the log
# tracks what got built, not conversation.
#
# Authorized mid-run changes to an approved contract are appended to that entry's `revisions` list, not
# overwritten silently. Unauthorized mid-run deviation from an approved contract is not recorded here at
# all — it is a stop-on-triggers violation and belongs in meta-drift-eventlog/DRIFTLOG.yaml instead.
#
# meta-learning sweeps this file for every entry in `status: verified` when invoked. It does not target
# a single named contract.

contracts:
  - contract_id: contract-001
    feature: reshape-phase0-capture
    date_proposed: 2026-08-10
    date_approved: 2026-08-10
    tier_1: |
      You are the owner of a standard that was discovered and refined by building this
      system. You are about to remove many of the very features that taught the standard
      what it knows. Before any of that happens, you want two things safely captured: a
      portable copy of everything the standard learned — clean enough that a future
      project of the same kind can start from it — and a browsable snapshot of the
      complete system as it stands today. Success looks like: the learned standard exists
      as its own self-contained artifact, independent of this project's fate; the
      full-featured system remains reachable by name forever; and nothing about the
      running system has changed. If this doesn't happen first, the reshaping destroys
      the evidence the standard is built on, and the months of work the standard
      represents can never be extracted again.
    tier_2: |
      1. Secure the pending groundwork. The v0.10 kit upgrade currently sits uncommitted.
         It is committed first (excluding Claude-Processing.md, which stays for review)
         so the snapshot and everything after it stand on a recorded state. Flagged
         judgment call: contract approval doubles as commit authorization for this and
         use case 4 — stated explicitly, not inferred.
      2. Extract the generation-1 library by running meta-extract exactly per its skill:
         classify the 31 type-category nodes vs the 2 project nodes (project-instructions,
         project-styleguide stay behind) and present the classification for confirmation;
         report maturity honestly (most nodes thin — proceeding anyway is the
         pre-authorized D5 deviation, and META.yaml records true statuses plus
         known_gaps); determine generation (no node carries inherited_from -> generation
         1); prepare stripped skill files, present strip-diffs grouped principle ->
         pattern -> implementation, and write .claude/library/blazor-web-app/ + META.yaml
         only after the single strip-approval gate; fill library_entry in MANIFEST.yaml.
         Edge: stripping a project reference that leaves a hole in a skill -> the hole is
         flagged in the diff presentation, never papered over.
         Edge: .claude/library/blazor-web-app/ already existing -> stop and ask.
      3. Snapshot the full system: after the extraction commit, create git tag
         pre-reshape and branch full-featured at that HEAD. Edge: created locally;
         pushing follows the owner's normal flow (no unasked push).
      4. Record and verify: extraction committed; verification = library folder contains
         all 31 stripped skill files, META.yaml parses and its node list matches the
         manifest's type-category set, library_entry written, tag and branch exist,
         working tree clean, no file outside .claude/ and git refs touched — production
         code and build provably unaffected.
    tier_3: |
      - meta-extract/SKILL.md governs mechanics end-to-end; its internal gates
        (classification confirm, maturity confirm, strip-diff approval) are honored
        inside this contract — approval of the contract does not skip them. (-> UC2)
      - D5 recorded as this contract's one authorized deviation: extraction despite thin
        pre-build nodes and the open high-priority gap-001 (which this contract
        resolves). No status is inflated to mature to satisfy criteria. (-> UC2)
      - Base-kit nodes and instance data (MANIFEST.yaml, DRIFTLOG.yaml,
        CONTRACT-LOG.yaml, LEARNINGLOG.yaml) never enter the library, per meta-extract's
        asymmetry table. (-> UC2)
      - MANIFEST.yaml is written only at the two points its protocol allows here:
        library_entry (extract step 4c) and gap-001 status -> resolved. No other
        manifest surgery. (-> UC2, UC4)
      - Commits follow implementation-commit-and-push discipline (why-focused messages;
        Claude-Processing.md excluded); no push. (-> UC1, UC3, UC4)
      - No production source, test, or config file is touched — this contract's diff is
        .claude/ + git refs only. (-> UC4)
      - Novel guardrail flagged for standard evolution: "extract the library before
        destructively reshaping the system that grounds it" is not covered by any
        existing kit node — after implementation it becomes a classification proposal
        (likely a principle candidate) in this contract's Standard Evolution Report.
        (-> UC2)
    status: learned
    revisions: []
    work_id: work-001

  - contract_id: contract-002
    feature: reshape-c1-analytics-cut
    date_proposed: 2026-08-10
    date_approved: 2026-08-10
    tier_1: |
      You are shaping this product so a developer who discovers it can understand the
      whole thing in an afternoon. Analytics — dashboards, rollup jobs, CSV/PDF exports,
      the exposure view — is impressive but stands outside the five things this product
      is, and is exactly the kind of heavy subsystem that makes a newcomer bounce. You
      want it gone completely: no dashboard, no background jobs, no report generator, no
      leftover strings or half-wired remnants — and everything the product actually is
      still working exactly as before. Success: the admin area simply no longer has an
      analytics section, the system runs leaner, no other feature changed behavior. If
      the cut doesn't happen, the repo keeps ~3,700 lines plus a PDF engine for a
      capability outside the product's identity.
    tier_2: |
      1. Remove the UI: AdminAnalytics.razor, the three panels, the facade partial +
         IAssetHubApiClient members, nav link + AdminHome tile, AnalyticsResource
         .resx/.sv.resx + marker + _Imports. Edge: the Insights nav group STAYS
         (watermark-verify still lives there); removed in C2 with its last member.
      2. Remove the API surface: AnalyticsEndpoints + registration, DTOs,
         IAnalyticsService. Edge: confirm no analytics endpoint carries a public-API
         marker before deletion; if found, surface as a SemVer event.
      3. Remove services and jobs: three Infrastructure services + two repositories +
         DI lines, AnalyticsSettings bindings (Infrastructure + Worker), Worker's
         AnalyticsRollupBackgroundService, AnalyticsPdfCleanupService,
         BuildAnalyticsPdfHandler, AnalyticsMessages, the build-analytics-pdf
         publish/listen pair in both Program.cs. QuestPDF leaves the Worker csproj.
      4. Remove the data model: AnalyticsDailyRollup, AnalyticsStorageRollup,
         AnalyticsPdfJob, AnalyticsEnums, three *Configuration classes +
         ApplyConfiguration calls; generate a NEW DropAnalyticsRollups migration
         (never edit the 2026-05-08 one). Edge: Down() recreates schema not data —
         documented closest reversal; rollups are re-derivable aggregates.
      5. Remove tests: two service test classes, two bUnit panel tests,
         18-analytics.spec.ts. Spec numbering keeps its gap.
      6. Prove nothing else moved: pattern-regression-baseline recorded before any
         change; after the cut, baseline check zero regressions, non-incremental
         Release build zero warnings, residual sweep (Analytics|QuestPDF|
         build-analytics-pdf) returns only BrandService's comment; analytics.* audit
         strings live only in DB rows.
      7. Correct the standard in the same change: T5-ANL-01 memory amended; manifest
         notes on pattern-time-series-rollup and pattern-hash-keyed-pii-reveal that
         the project instantiation was removed 2026-08 (patterns stand in library
         gen-1). CLAUDE.md verified to carry no analytics prose.
      8. Commit per implementation-commit-and-push (why-focused; no push unless
         asked). Contract approval authorizes the commit.
    tier_3: |
      - Watermarking out of scope: WatermarkDownload, IRecipientCryptoService, all
        embed/verify paths untouched — analytics only read them. (-> UC2, UC3)
      - No half-deleted feature: the UC6 residual sweep is the acceptance gate; any
        hit outside the named survivors fails the contract. (-> UC6)
      - Migration follows implementation-ef-config-migration +
        implementation-migration-check audit; has-pending-model-changes clean at the
        end. (-> UC4)
      - resx keys removed from both languages together; i18n-check run; no orphaned
        Group_Insights usage. (-> UC1)
      - DI removals verified with di-check — no orphaned interfaces/registrations.
        (-> UC3)
      - Verified means: baseline check clean + zero-warning non-incremental build +
        full test pass + residual sweep clean. (-> UC6)
      - Scope guard: no opportunistic cleanup of neighboring code — adjacent findings
        get reported, not done. (-> all)
    status: learned
    revisions:
      - date: 2026-08-10
        change: |
          Two one-line dependency fixes outside the contracted file set, forced when the
          Worker.csproj edit triggered a fresh NuGet restore (floating versions moved +
          advisory DB refreshed): (1) bump Microsoft.IdentityModel.Protocols.OpenIdConnect
          pin in AssetHub.Api.csproj 8.15.0 -> 8.19.2 (JwtBearer 10.0.10 float requires it,
          NU1605); (2) add top-level Microsoft.OpenApi pin at the patched release to clear
          the NU1903 high advisory (GHSA-v5pm-xwqc-g5wc), per the repo's transitive-pin
          convention. Pre-existing dependency debt surfaced by restore, not analytics-cut
          fallout.
        authorised_by: '"approved as suggested" — owner, 2026-08-10, after mid-run stop'
      - date: 2026-08-10
        change: |
          Generated DropTable calls replaced with idempotent raw SQL (DROP TABLE IF
          EXISTS) after the first integration run failed 282 tests on 42P01: the paired
          hand-written AddAnalyticsRollups migration carries no [Migration] attribute
          (Designer.cs never generated), so EF never discovered it and migration-managed
          databases never created the tables. Idempotency here is the contracted
          ef-config-migration standard applied (tier-3 guardrail), recorded as a revision
          for traceability of the changed migration shape, not as a new scope grant.
        authorised_by: 'tier-3 guardrail "Migration follows implementation-ef-config-migration" in the approved contract'
    work_id: work-002

  - contract_id: contract-003
    feature: reshape-c2-watermarking-cut
    date_proposed: 2026-08-11
    date_approved: 2026-08-11
    tier_1: |
      You are continuing to carve this product down to the five things it is. Forensic
      watermarking — invisible marks embedded in downloads, per-collection toggles and
      per-asset/share overrides, the verify page, the recipient fingerprinting — is the
      single most impressive-but-heavy subsystem left, exactly the kind that makes a
      discovering developer bounce off the codebase. You want it gone entirely:
      downloads go back to being simple and fast for everyone, sharing loses its
      watermark switches, the admin area loses its last Insights page, and no trace
      remains — while upload, organize, find, control access, and share keep working
      exactly as they do today. If this doesn't happen, the repo keeps ~5,000 lines of
      signal-processing and crypto plumbing, plus a mandatory deployment secret, for a
      capability outside the product's identity.
    tier_2: |
      1. Roll the baseline forward (pattern-regression-baseline update): green state at
         2e690d7 becomes the reference.
      2. Revert the download flow to unconditional presigned-302 in AssetEndpoints,
         ShareEndpoints, AssetQueryService, PublicShareAccessService/IShareAccessService,
         ZipBuildService (zips stop embedding marks). Behavior change, not deletion —
         stream-vs-302 branch tests updated to assert pure 302. Edge: WatermarkDownload
         recording disappears with the branch.
      3. Remove the feature surface: both Services/Watermarking/ folders in their
         entirety (incl. IRecipientCryptoService/RecipientCryptoService and the C1
         survivor comments), WatermarkEndpoints + registration, DTOs/messages/constants/
         CacheKeys entries, WatermarkSettings (validate-on-start dies with it), the
         Worker fingerprint background service, facade partial + 4 interface members +
         2 ctor params, three UI components + AdminWatermarkVerify page, watermark
         fields in CreateShareDialog/ManageAccessDialog, DTO + mapper fields.
      4. Retire the Insights group: admin nav to three groups, AdminHome to three
         tiles, breadcrumb case removed, Group_Insights + Group_Insights_Desc deleted
         EN+SV (cap-then-group at group death, principle-information-architecture).
         Routable admin pages 13 -> 12.
      5. Remove the data model: new generated migration dropping WatermarkDownloads
         table + five entity columns (Asset x3, Collection x1, Share x1);
         AddWatermarkSupport history untouched (its Designer verified present — EF
         discovers it, so plain DropTable/DropColumn is correct); data loss documented;
         has-pending-model-changes clean.
      6. Remove config & compose wiring: Watermarking__HmacKeyBase64 env lines from
         both services in compose (+ prod compose). Edge: WATERMARK_HMAC_KEY in the
         gitignored docker/.env is reported for the owner to delete manually.
      7. Remove tests: DctLsbWatermarkRoundTripTests, both bUnit component tests,
         17-watermarks.spec.ts, plus watermark cases inside shared endpoint/service
         tests (edited, not deleted).
      8. Prove nothing else moved: residual sweep (watermark|Watermarking__|WATERMARK_|
         DctLsb|RecipientCrypto) over src/tests/docs/docker as acceptance gate;
         expected survivors migration history only. Baseline check zero regressions;
         non-incremental build no new warnings.
      9. Correct the standard in the same change: T5-WMK-01 memory -> HISTORICAL,
         manifest note on pattern-hash-keyed-pii-reveal (instantiation fully removed),
         README bullets + user-scenario catalog + styleguide swept. Commit per
         implementation-commit-and-push; approval authorizes the commit; no push.
    tier_3: |
      - SemVer: WatermarkEndpoints carries 4 public-API markers — removal is a breaking
        change, named in the commit, grounded in the approved plan's C10. (-> UC3)
      - Scope guard: brands/guests/shares logic untouched beyond watermark fields and
        the download-branch revert; adjacent findings reported, not fixed. (-> UC2, UC3)
      - Migration discipline: ef-config-migration + migration-check audit; never edit
        AddWatermarkSupport; model byte-identical until the new migration. (-> UC5)
      - i18n parity: removed/edited keys change in both languages together. (-> UC3, UC4)
      - DI: registrations removed with interfaces; no orphans either direction. (-> UC3)
      - Verified means: baseline clean + zero-new-warnings non-incremental build + full
        test pass + residual sweep clean + docker compose config -q parses. (-> UC8)
      - Float hygiene: no package changes expected; any fresh-restore failure is a
        mid-run stop and surface, not a silent fix. (-> all)
    status: learned
    revisions: []
    work_id: work-003

  - contract_id: contract-004
    feature: reshape-c3-brands-guests-cut

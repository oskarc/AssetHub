    note: Auto-loaded by Claude Code natively. The [layer]-[name]/SKILL.md naming convention does not apply. Decomposing this node into smaller principle/pattern/implementation skills is the largest standing skill-builder programme for this project. Truth-passed 2026-06-12 (post-loopback architecture corrections — facade contract, error idiom, hybrid optimistic rule, Api/Worker hosting split, per-entity DbContext config).


    diffs:
      - dimension: stakes
        assumption: "A green build plus review is adequate proof that no route lost authorization"
        discovery: "Authorization posture is a property of annotations spread across 13 route groups. A build cannot see it and diff review scales badly; capturing posture per group before the change and diffing after made the invariant checkable in seconds."
        learning: "When a change could silently weaken a security invariant, capture the invariant mechanically before the change and diff it after. A green build is evidence about compilation, not about the property you care about."

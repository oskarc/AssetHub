# Default env file for local development. Override with:
#   docker compose --env-file .env.prod up

services:
  postgres:
    image: postgres:16.6-alpine
    container_name: assethub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    # Security hardening
    user: "70:70"  # postgres user in alpine
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: assethub-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /minio --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    # Security hardening
    user: "65534:65534"  # nobody user (MinIO needs no specific user)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: assethub-api
    environment:
      TZ: Europe/Stockholm
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:7252
      Identity__SeedAdmin__UserName: "${IDENTITY_ADMIN_USERNAME:-admin}"
      Identity__SeedAdmin__Email: "${IDENTITY_ADMIN_EMAIL:-admin@assethub.local}"
      Identity__SeedAdmin__Password: "${IDENTITY_ADMIN_PASSWORD:-}"
      # Test viewer for the E2E gate — DEV ONLY (never set in prod compose). Password comes from
      # TEST_VIEWER_PASSWORD in docker/.env; if it is unset the seeder skips this account.
      Identity__SeedTestViewer: "true"
      Identity__TestViewer__UserName: "testuser"
      Identity__TestViewer__Email: "test@example.com"
      Identity__TestViewer__Password: "${TEST_VIEWER_PASSWORD:-}"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /app/certs/dev-cert.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${ASPNETCORE_Kestrel__Certificates__Default__Password}
      ConnectionStrings__Postgres: "Server=postgres;Port=5432;Database=${POSTGRES_DB};User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: "${MINIO_ACCESS_KEY}"
      MinIO__SecretKey: "${MINIO_SECRET_KEY}"
      MinIO__BucketName: "${MINIO_BUCKET_NAME}"
      MinIO__UseSSL: "false"
      MinIO__PublicUrl: "localhost:9000"
      MinIO__PublicUseSSL: "false"
      App__BaseUrl: "https://assethub.local:7252"
      ClamAV__Enabled: "${CLAMAV_ENABLED:-false}"  # off by default; the `full` profile sets it true (C15)
      ClamAV__Host: "clamav"
      ClamAV__Port: "3310"
      ClamAV__TimeoutMs: "120000"
      ClamAV__ChunkSize: "262144"
      OpenTelemetry__OtlpEndpoint: "http://aspire-dashboard:18889"
    volumes:
      - ../certs:/app/certs:ro
    ports:
      - "127.0.0.1:7252:7252"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - api
          - api.assethub.local
      observability:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
          pids: 200
    # Security hardening
    user: "1654:1654"  # .NET 'app' user (set in Dockerfile, reinforced here)
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=2G,uid=1654,gid=1654

  mailpit:
    profiles: ["full"]
    image: axllent/mailpit:v1.21
    container_name: assethub-mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
          pids: 50
    # Security hardening
    user: "65534:65534"  # nobody user
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M,uid=65534,gid=65534

  # ── ClamAV (Malware Scanning) ────────────────────────────────────────────────
  clamav:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.ClamAV
    container_name: assethub-clamav
    environment:
      # Increase size limits for large media uploads (defaults: 25M/400M/1000M)
      CLAMD_CONF_StreamMaxLength: "1600M"
      CLAMD_CONF_MaxFileSize: "1600M"
      CLAMD_CONF_MaxScanSize: "1600M"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G
          pids: 100
    # Security hardening
    user: "100:101"  # clamav user (entrypoint detects non-root, skips chown/gosu)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/clamav:size=1M,uid=100,gid=101
      - /tmp:size=512M,uid=100,gid=101

  # ── Observability ────────────────────────────────────────────────────────────

  # .NET Aspire Dashboard — single container for traces, metrics, and structured logs
  aspire-dashboard:
    profiles: ["full"]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: assethub-aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"   # Dashboard UI
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 100
    # Security hardening
    user: "1654:1654"  # .NET 'app' user
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M,uid=1654,gid=1654

volumes:
  pgdata:
  miniodata:

networks:
  # Backend network - database and storage services only
  backend:
    driver: bridge
  # Observability network - monitoring and tracing
  observability:
    driver: bridge

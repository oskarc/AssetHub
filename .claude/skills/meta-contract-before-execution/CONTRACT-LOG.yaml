      8. Standard prose in the same change: T4-BP-01 + T4-GUEST-01 memories ->
         HISTORICAL; A-4 memory brand-logo note amended; USE-CASES chip list +
         sections marked removed; CLAUDE.md "BrandConfiguration is the exemplar"

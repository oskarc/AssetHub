  - contract_id: contract-012
    feature: reshape-c11-borderline-cuts
    date_proposed: 2026-08-14
    date_approved: 2026-08-14
    tier_1: |
      The last Phase-1 cut: the three features D1 marked borderline — SavedSearch,
      duplicate detection, and nested collections. Each reads as reasonable in
      isolation but sits outside the five-feature core, and each adds a concept a
      discovering developer must learn before reading the code that matters.

      DECISION A (owner: "go for A") — duplicate detection has TWO consumers.
      The user-facing feature is the upload gate (block on SHA-256 match,
      admin-only force override, duplicate_blocked / duplicate_override audit
      events); that is what D1 targeted and it goes. But GetBySha256Async is also
      called by the migration ingest handler, where a hash match marks the item
      Skipped/Duplicate — which is what makes re-running an import idempotent
      rather than duplicating the library. Migration dedup is KEPT.
      GetBySha256Async survives with one caller. The rejected alternative (cut
      both) was argued against: it turns a migration re-run into a destructive
      operation.

      DECISION B (approved as recommended) — nested collections reach into ACL
      resolution. CollectionAuthorizationService walks the ancestor chain to
      compute an effective role for collections with InheritParentAcl, bounded by
      MaxCollectionDepth. Removing nesting is a revert-to-simpler on the
      ACCESS-CONTROL path, and access control is one of the five kept features.
      All three legs stay in one contract, with the nesting leg gated by a
      mechanical ACL-equivalence check rather than a green build.
    tier_2: |
      1. Baseline roll-forward to a81f561 (971), docker pre-check first
         (drift-001). NO tree mutation between a suite build and its verdict
         (drift-007, count 4).
      2. Tracer greps: SavedSearchesMenu / SaveSearchDialog by name, the savedId
         query token, CollectionTreeHelper, MaxCollectionDepth,
         duplicate_blocked / duplicate_override.
      3. Leg 1 — SavedSearch (bounded-module deletion): entity + enums,
         repository + interface, service + interface, DTOs, EF config + DbSet,
         endpoints, SavedSearchesMenu, SaveSearchDialog, facade partial +
         interface members, MainLayout entry, Search.razor ?savedId= replay,
         SavedSearchServiceTests (14).
      4. Leg 2 — duplicate upload gate (revert-to-simpler): the two
         AssetUploadService blocks, the force query parameter on upload/confirm
         endpoints, the UI force-retry path, the two audit event types. KEEP
         GetBySha256Async, Asset.Sha256, AssetVersion.Sha256, MigrationItem.Sha256
         and the migration handler dedup. Verification: upload tests pass with the
         block-path cases removed and EVERY other assertion unchanged.
      5. Leg 3 — nested collections (revert-to-simpler, ACL-gated):
         ParentCollectionId, InheritParentAcl, the WalkEffectiveRole ancestor
         walk, descendant/ancestor repository queries, MaxCollectionDepth,
         reparent + inherit-toggle endpoints, CollectionTree +
         CollectionTreeHelper (and the three components flattening through it),
         CollectionServiceNestingTests (16) + CollectionInheritanceWalkTests (8)
         + CollectionAclInheritanceTests (7). Effective-role resolution collapses
         to direct ACL on the collection plus system-admin bypass.
      6. Migration dropping SavedSearches + the two Collections columns,

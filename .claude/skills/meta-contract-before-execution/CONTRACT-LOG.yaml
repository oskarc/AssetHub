      rather than the markup bent to suit the test.

      /auth/culture carries AllowAnonymous + DisableAntiforgery, matching the
      sibling auth form POSTs (/auth/login, /auth/reset-password) which must be
      CSRF-exempt to work as plain forms. Impact of forging one is a changed UI
      language, and the culture value is validated against the supported list

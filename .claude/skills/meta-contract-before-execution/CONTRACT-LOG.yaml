  - contract_id: contract-021
    feature: remove-the-unreachable-rest-mutations
    date_proposed: 2026-08-29
    date_approved: 2026-08-29
    follows: contract-020
    tier_1: |
      46 mutating REST endpoints cannot be called by anyone. Verified four ways:
      nothing issues an antiforgery token, nothing sends X-CSRF-TOKEN,
      AddJwtBearer is not registered, and no JWT issuance path exists. Cookie
      callers are blocked by the gate; the bearer bypass the gate was built
      around no longer exists (PATs went with contract-011).

      The Blazor UI never needed them — it mutates through the IN-PROCESS FACADE,
      not HTTP. What the browser genuinely fetches is media bytes and downloads,
      all reads.

      Dead surface: 46 endpoints plus RequireAntiforgeryUnlessBearer and 42
      DisableAntiforgery call sites that exist only to serve them. CLAUDE.md
      devotes a section and a pre-commit sweep row to a gate protecting endpoints
      nobody can reach.
    tier_2: |
      1. Baseline 911 unit / E2E 123-18-51 at cabab8c. Docker pre-check.
      2. CAPTURE THE INVARIANT FIRST — enumerate every /api/v1/* route the browser
         actually fetches, from Ui markup, C# and JS. That list is what survives.
         Shown to the owner BEFORE any deletion; it is the step that decides
         correctness.
      3. Remove the unreachable mutating endpoints and orphaned handlers/DTOs.
      4. Remove RequireAntiforgeryUnlessBearer, its filter and the
         DisableAntiforgery chains — ONLY if no mutating endpoint survives. If one
         does, the gate stays and that is stated.
      5. Delete the 08-api specs (33) and ApiHelper mutation methods.
      6. Prose: CLAUDE.md dual-gate section, the false "JWT bearer principals still
         exist", the sweep row.
    tier_3: |
      - Every surviving route is on the captured browser list; every removed one is
        not — enumerated both ways.
      - Upload, thumbnail, download, share media, ZIP and migration CSV all still
        work in the container.
      - Unit suite: a NAMED delta, zero unexplained changes.
      - E2E >= 123 passing; the 08-api block's 32 skips resolve by deletion.
      - No DisableAntiforgery without a gate, no gate without endpoints.
    status: stopped
    stopped: 2026-08-29
    revisions: []
    work_id: null
    stop_reason: |
      Tier_2 step 2 was a gate: capture what the browser actually fetches BEFORE
      deleting anything. That gate fired and the contract's premise did not survive.

      TIER_1 WAS WRONG. "46 mutating REST endpoints are unreachable" is false. Two
      are browser-invoked POSTs (collections/{id}/download-all via
      enqueueAndPollZipDownload, shares/{token}/download-all), and a live test
      returned HTTP 202 for a cookie-authed POST with no CSRF header — the exact
      request I had predicted would be blocked.

      ROOT CAUSE, and it is a SECURITY REGRESSION, not dead surface.
      AntiforgeryUnlessBearerFilter validates only when
        http.User.Identity.AuthenticationType == CookieAuthenticationDefaults.AuthenticationScheme
      i.e. the literal "Cookies". Since contract-015 replaced Keycloak/OIDC with
      ASP.NET Core Identity, principals authenticate under
      IdentityConstants.ApplicationScheme = "Identity.Application". The strings do
      not match, isCookieAuth is always false, and the filter returns next(context)
      without validating. The P-12 / A-7 gate CLAUDE.md calls load-bearing has been
      INERT for every authenticated user since the Identity migration.

      Corrected reachability model: endpoints chaining .DisableAntiforgery() (42
      sites) bypass the built-in middleware AND the custom filter is inert, so they
      are REACHABLE and CSRF-unvalidated. The handful without it are blocked by the
      built-in middleware — which is why my earlier /api/v1/assets upload got 400
      from AntiforgeryMiddleware, not from the filter.

      SEVERITY QUALIFIED, NOT INFLATED. The Identity application cookie is
      SameSite=Strict, so cross-site requests do not carry it and a classic CSRF
      attack fails anyway. What was lost is defence in depth, and the codebase
      believes two mechanisms protect it when only one is live.

      Nothing was deleted. The right next move is to FIX the gate, then re-derive
      which endpoints are genuinely unreachable — the excision cannot be scoped
      against a false premise.

  - contract_id: contract-022
    feature: restore-the-csrf-gate
    date_proposed: 2026-08-29
    date_approved: 2026-08-29
    follows: contract-021
    tier_1: |
      AntiforgeryUnlessBearerFilter decides whether to validate by string-matching
      the principal's AuthenticationType against CookieAuthenticationDefaults
      .AuthenticationScheme — the literal "Cookies". ASP.NET Core Identity issues
      "Identity.Application". Since contract-015 the comparison has never matched,
      so the filter returns next(context) without validating. The P-12 / A-7 gate
      has been inert for every authenticated user.

      SameSite=Strict on the auth cookie means this cost defence in depth rather
      than opening a hole — but the codebase believes two mechanisms guard it while
      one is live, and CLAUDE.md tells future readers not to reopen a shut gate.

      WHY THIS IS ONE CONTRACT, NOT TWO: fixing the comparison BREAKS two working
      flows. Collection "Download all" and shared-collection "Download all" POST via
      enqueueAndPollZipDownload with no antiforgery header, and nothing in the app
      issues a token. Repair the gate alone and those flows start returning 400.

      The brittleness is the real lesson: a string-matched scheme name silently
      decouples from behaviour when the identity provider changes. Remove the
      failure mode rather than re-encode it against a new literal
      (principle-encode-over-document).
    tier_2: |
      1. Baseline 911 unit / E2E 123-18-51 at 4e426a6. Docker pre-check.
      2. Make the filter SCHEME-AGNOSTIC: skip for Bearer, skip for unauthenticated
         (public share endpoints depend on it), otherwise validate. No scheme-name
         literal survives.
      3. Supply the token to the two POSTing flows — render it server-side via
         IAntiforgery into the existing `headers` argument, which enqueueZipBuild
         already spreads into the fetch.
      4. Regression tests BOTH directions: cookie-authed mutation without a token is
         rejected, with one is accepted. The missing negative test is why an inert
         gate went unnoticed.
      5. Prose: correct CLAUDE.md's dual-gate section.
    tier_3: |
      - Cookie-authed POST without a token -> 400; with a valid token -> succeeds.
        Both asserted in the suite.
      - Anonymous share endpoints keep working, verified against a real share link.
      - BOTH "Download all" flows still work in the container, authenticated and via
        a public share.
      - No scheme-name string comparison remains in the filter.
      - Unit suite 911 plus named new tests; E2E >= 123.
    status: implemented
    implemented: 2026-08-29
    revisions: []
    work_id: null
    outcome: |
      Acceptance met. Suite 911 -> 913 (2 named guards, 0 removed, 0 regressions).

      GATE PROVEN LIVE IN THE CONTAINER: the identical POST that returned 202
      before the fix now returns 400 "The required antiforgery cookie
      assethub.csrf is not present." The real UI flow still works — a browser
      click on Download All sends X-CSRF-TOKEN and gets 202, with both
      assethub.csrf and assethub.auth cookies present. Anonymous share path
      unaffected: POST to a share download-all returns NOT_FOUND, not an
      antiforgery error, so the gate correctly skips before the handler.

      GUARD PROVEN DISCRIMINATING: reverted the filter to the original
      AuthenticationType == "Cookies" comparison and the negative test failed;
      restored and it passes. It detects the exact defect that hid for four
      contracts.

      DESIGN CHANGED UNDER MEASUREMENT. The first fix validated every
      authenticated request, which would have broken all 717 API tests —
      TestAuthHandler authenticates with no cookies and no Authorization header.
      That forced a better rule: CSRF requires an AMBIENT credential, so key on
      the presence of cookies. The suite stays green legitimately rather than by
      exemption, and no scheme-name literal survives outside an explanatory comment.

      A 500 during test development was traced to AntiforgeryOptions.Cookie
      .SecurePolicy = Always colliding with an HTTP test host; fixed by addressing
      the test client as HTTPS rather than by weakening a correct production setting.

    acceptance_gap: |
      UNMET AND MISSED AT THE TIME: tier_3 required "E2E >= 123". The unit suite
      (913) and the container gate (202 -> 400) were verified; the E2E run was NOT
      made before committing. Found during contract-023: restoring the gate broke
      the E2E suite's REST seeding — ApiHelper sends no X-CSRF-TOKEN, so
      createCollection now fails and every spec that seeds via beforeAll cascades.
      Blast radius: 9 spec files, 141 tests.

      This is a verification-discipline failure, not a design failure. The fix
      itself is correct — the gate SHOULD reject an untokened cookie mutation. What
      was missed is that the suite depended on the hole being open.


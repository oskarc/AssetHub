# MANIFEST.yaml
# Project instance data. Governed by meta-manifest/SKILL.md.
# Generated by meta-bootstrap — not filled manually by the developer.
# Updated only through the skill-builder process with developer approval.
# In the base-building-kit repo: templates/MANIFEST.template.yaml
# In a consumer project: .claude/skills/templates/MANIFEST.template.yaml
#
# AGENT INSTRUCTIONS:
# This file is a template. meta-bootstrap reads it and replaces all
# __PLACEHOLDER__ values with real values derived from project orientation.
# Do not leave any __PLACEHOLDER__ in the written output file.

kit_identity:
  kit_name: __PROJECT_NAME__
  kit_type: project
  category: __CATEGORY__
  version: 0.1
  parent_kit: base-building-kit
  library_kit: __LIBRARY_KIT__
  status: active

nodes:

  # ─── Base building kit (inherited — do not modify) ────────────────────────

  - id: base-foundation
    concern: Philosophical foundation and operational frame
    skill_file: meta-foundation/SKILL.md
    layer: meta
    phase: always
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-bootstrap
    concern: First-run installation — introduces the practice, checks library, establishes authority, creates project manifest
    skill_file: meta-bootstrap/SKILL.md
    layer: meta
    phase: pre-build
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Already run. Not invoked again.

  - id: base-contract
    concern: Contract before execution — three-tier proposal, approval gate, standard evolution report
    skill_file: meta-contract-before-execution/SKILL.md
    layer: meta
    phase: [pre-build, post-build]
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-skill-builder
    concern: Abstraction loop — classifying learnings, updating skills, raising the standard
    skill_file: meta-skill-builder/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-contract]
    open_gaps: []

  - id: base-manifest
    concern: Kit topology — node registry, coverage map, gap tracking, self-organisation
    skill_file: meta-manifest/SKILL.md
    data_file: meta-manifest/MANIFEST.yaml
    layer: meta
    phase: pre-build
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-extract
    concern: Type-category kit extraction — separates transferable nodes from project nodes, produces library artifact and META.yaml
    skill_file: meta-extract/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-manifest, base-skill-builder]
    open_gaps: []
    note: Run when developer decides type-category nodes are mature enough for the library.

  - id: base-antidrift
    concern: Post-output drift scoring — compact evidence-based check against governing aspects and active skills after every output
    skill_file: meta-antidrift/SKILL.md
    layer: meta
    phase: always
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Runs after every output. Makes drift visible so the human can accept or aim higher.

  - id: base-antidrift-expand
    concern: Session-level drift analysis — full pattern mapping, implicit approval accumulation, discipline fall point, elevation vs recovery assessment
    skill_file: meta-antidrift-expand/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-antidrift, base-foundation]
    open_gaps: []
    note: Invoked explicitly by the human for re-orientation conversations and skill-builder passes.

  # ─── Inherited type-category nodes ────────────────────────────────────────
  # Populated by meta-bootstrap if a library kit was integrated.
  # Each node is copied from .claude/library/[category]/META.yaml.
  # __INHERITED_NODES__
  #
  # - id: [node-id]
  #   concern: [concern from library META.yaml]
  #   skill_file: [layer]-[name]/SKILL.md
  #   tier: type-category
  #   layer: [principle | pattern | implementation]
  #   phase: [pre-build | during-build | post-build]
  #   status: [as per library META.yaml]
  #   inherited: true
  #   inherited_from: [library kit name and version]
  #   dependencies: []
  #   open_gaps: []

  # ─── Project nodes (discovered through use) ───────────────────────────────
  # Do not populate upfront. Nodes emerge from Standard Evolution Reports.
  # Naming convention: [layer]-[name]/SKILL.md
  #
  # Phase vocabulary (use exact values):
  #   always          — active in all phases (foundation, antidrift)
  #   pre-build       — governs before implementation begins
  #   during-build    — governs during implementation
  #   post-build      — governs after implementation completes
  #   [pre-build, post-build]  — active in multiple specific phases
  #
  # - id: [concern-id]
  #   concern: [what area this node owns — be precise]
  #   skill_file: [layer]-[name]/SKILL.md
  #   tier: project
  #   layer: [principle | pattern | implementation]
  #   phase: [see vocabulary above]
  #   status: [mature | thin | missing]
  #   inherited: false
  #   dependencies: []
  #   open_gaps: []

coverage_map:

  # ─── Base kit coverage (always present) ───────────────────────────────────

  - concern: Philosophical foundation & governing aspects
    node_id: base-foundation
    layer: meta
    phase: always
    status: mature

  - concern: Project onboarding & authority establishment
    node_id: base-bootstrap
    layer: meta
    phase: pre-build
    status: mature

  - concern: Contract & proposal
    node_id: base-contract
    layer: meta
    phase: [pre-build, post-build]
    status: mature

  - concern: Skill evolution
    node_id: base-skill-builder
    layer: meta
    phase: post-build
    status: mature

  - concern: Kit topology
    node_id: base-manifest
    layer: meta
    phase: pre-build
    status: mature

  - concern: Type-category extraction & library promotion
    node_id: base-extract
    layer: meta
    phase: post-build
    status: mature

  - concern: Post-output drift scoring
    node_id: base-antidrift
    layer: meta
    phase: always
    status: mature

  - concern: Session-level drift analysis
    node_id: base-antidrift-expand
    layer: meta
    phase: post-build
    status: mature

  # ─── Type-category & project coverage ────────────────────────────────────
  # __INHERITED_COVERAGE__ (replaced with library kit coverage if integrated)
  # Project concerns surface through use — do not invent them upfront.

gap_queue: []

library_entry: null

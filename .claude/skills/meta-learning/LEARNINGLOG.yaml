# LEARNINGLOG.yaml
# Instance data for meta-learning. Governed by meta-learning/SKILL.md.
# Each entry represents a verified diff between a contracted prediction and what verification confirmed.
# Written only when meta-learning is invoked and sweeps meta-contract-before-execution/CONTRACT-LOG.yaml
# for entries in status: verified. See meta-learning/SKILL.md for the full schema and a worked example.
#
# Schema reference:
#
#   - work_id: work-NNN
#     feature: [feature name from contract]
#     contract_id: [reference to contract in CONTRACT-LOG.yaml]
#     surfaced_in: YYYY-MM-DD
#     states:
#       contracted: {approach, principles_invoked, patterns_invoked, assumptions}
#       implemented: {approach, deviations}
#       verified: {method, result, evidence}
#     diffs:
#       - dimension: [principle | pattern | implementation | stakes]
#         assumption: [...]
#         discovery: [...]
#         learning: [...]
#         node_impact: [{node_id, action}]
#     elevation_proposal:
#       - target: [node or new skill]
#         kind: [principle | pattern | implementation]
#         evidence: [...]
#         human_decision: [pending | approved | declined]

entries:
  - work_id: work-001
    feature: reshape-phase0-capture
    contract_id: contract-001
    surfaced_in: 2026-08-11
    states:
      contracted:
        approach: meta-extract generation-1 library + pre-reshape snapshot (tag + branch) before any cut
        principles_invoked: [meta-extract protocol, D5 authorized criteria deviation]
        patterns_invoked: []
        assumptions:
          - "31 type-category nodes classify cleanly; stripping is mostly light"
          - "Extracting despite thin statuses is sound when statuses are recorded honestly"
      implemented:
        approach: as contracted; 19 of 31 files byte-identical, 12 stripped behind the single gate
        deviations: []
      verified:
        method: human-confirmation
        result: pass
        evidence: "META.yaml parses; node set == manifest type-category set; 31 skills + META in library; pre-reshape tag + full-featured branch at a323e87; owner confirmed 2026-08-11"
    diffs:
      - dimension: principle
        assumption: "Extraction timing is purely an end-of-project maturity judgment"
        discovery: "The reshape would have deleted the features grounding the standard before any extraction ran"
        learning: "Capture precedes demolition — extract before destructively reshaping the grounding system"
        node_impact:
          - node_id: base-extract
            action: update
    elevation_proposal:
      - target: meta-extract (when-to-run guidance)
        kind: principle
        evidence: diffs[0]
        human_decision: approved

  - work_id: work-002
    feature: reshape-c1-analytics-cut
    contract_id: contract-002
    surfaced_in: 2026-08-11
    states:
      contracted:
        approach: delete analytics across all layers; generated DropTable migration; residual sweep over src/tests
        principles_invoked: [no-half-deleted-feature (novel guardrail)]
        patterns_invoked: [pattern-regression-baseline, implementation-ef-config-migration]
        assumptions:
          - "The migration chain provisioned the analytics schema in every environment"
          - "src/tests sweep scope is sufficient"
          - "No dependency changes will be needed"
      implemented:
        approach: as contracted plus two authorized revisions
        deviations:
          - "OpenIdConnect pin 8.15.0->8.19.2 + Microsoft.OpenApi 2.7.5 pin (float movement; authorized)"
          - "DropTable -> DROP TABLE IF EXISTS (dead Add migration; authorized via tier-3 grounding)"
      verified:
        method: tests
        result: pass
        evidence: "1450/1450 green, zero regressions, 15 removals all analytics-named @ 2e690d7; owner confirmed 2026-08-11"
    diffs:
      - dimension: implementation
        assumption: "AddAnalyticsRollups provisioned tables wherever migrations ran"
        discovery: "The hand-written migration had no [Migration] attribute — EF never discovered it; only EnsureCreated fixtures had the schema"
        learning: "A hand-written migration must carry the discovery attribute and appear in dotnet ef migrations list; unlisted = nonexistent"
        node_impact:
          - node_id: implementation-ef-config-migration
            action: update
          - node_id: implementation-migration-check
            action: update
      - dimension: pattern
        assumption: "src/tests sweep suffices"
        discovery: "docs/USE-CASES.md still advertised analytics — caught only by C2's wider sweep"
        learning: "Excision sweep scope is canonical: src, tests, docs, docker, config"
        node_impact:
          - node_id: pattern-feature-excision
            action: new
      - dimension: implementation
        assumption: "No dependency changes needed"
        discovery: "Floating versions + fresh advisory DB made the build calendar-dependent (NU1605/NU1903/CS8602)"
        learning: "Lock the resolved package graph; builds must be time-independent"
        node_impact:
          - node_id: project-instructions
            action: update  # repo decision: RestorePackagesWithLockFile
    elevation_proposal:
      - target: implementation-ef-config-migration + implementation-migration-check
        kind: implementation
        evidence: diffs[0]
        human_decision: approved
      - target: pattern-feature-excision (new skill)
        kind: pattern
        evidence: diffs[1]
        human_decision: approved
      - target: repo decision (NuGet lock files)
        kind: implementation
        evidence: diffs[2]
        human_decision: approved

  - work_id: work-003
    feature: reshape-c2-watermarking-cut
    contract_id: contract-003
    surfaced_in: 2026-08-11
    states:
      contracted:
        approach: delete watermark surface; REVERT download flow to unconditional presigned-302 with behavioral test updates; retire Insights group
        principles_invoked: [principle-information-architecture (cap-then-group at group death)]
        patterns_invoked: [pattern-regression-baseline]
        assumptions:
          - "The survey's file inventory is complete"
          - "Cut-vs-revert classification per touchpoint keeps verification honest"
      implemented:
        approach: as contracted; zero revisions; build enumerated 3 files the survey missed (name-evading handler, test, global using)
        deviations: []
      verified:
        method: tests
        result: pass
        evidence: "1425/1425 green, zero regressions, 25 removals all watermark-named @ 6dd7a0e; owner confirmed 2026-08-11"
    diffs:
      - dimension: pattern
        assumption: "The survey enumerates the full cut"
        discovery: "head-truncation and name-evasion missed 3 files; the compiler found every one"
        learning: "The build is the completeness authority; the survey only plans"
        node_impact:
          - node_id: pattern-feature-excision
            action: update
      - dimension: pattern
        assumption: "Revert-to-simpler touchpoints need behavioral verification"
        discovery: "Held exactly — 302-assert updates were the only behavioral test edits and the flows stayed green"
        learning: "Confirmed as contracted (prediction validated)"
        node_impact:
          - node_id: pattern-feature-excision
            action: verify
    elevation_proposal:
      - target: pattern-feature-excision
        kind: pattern
        evidence: diffs[0], diffs[1]
        human_decision: approved


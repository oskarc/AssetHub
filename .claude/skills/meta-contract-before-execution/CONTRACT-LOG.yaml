      10. Standard prose in the same change: T3-COL-01 + T3-NTF-01 memories ->
          HISTORICAL; USE-CASES sections + chips; CLAUDE.md corrections (UoW
          mention-fan-out example, hosting-split digests mention, Quality Guardrails
          AssetCommentsPanel exemplar re-pointed). Commit per
          implementation-commit-and-push; approval authorizes the commit; no push.

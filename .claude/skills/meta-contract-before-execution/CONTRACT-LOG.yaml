         T5-NEST-01-DESIGN.md.
    tier_3: |
      - ACL EQUIVALENCE PROVEN MECHANICALLY. A 75-test matrix across four
        nesting-independent access-control classes (AuthorizationEdgeCaseTests,
        CollectionAclServiceTests, ShareAccessServiceTests,
        CollectionServiceTests) was captured before the cut and must be identical
        after — same tests, same outcomes, ZERO assertion edits. A changed
        assertion is a stop-and-surface, not an edit. This is the contract's
        primary risk and does not get a "build is green" verdict. (-> decision B)
      - Migration re-run stays idempotent: the dedup path and its
        Skipped/Duplicate outcome untouched and still covered. (-> decision A)
      - Search keeps full-text, tags and all four facets; only saving/replaying
        a search goes. (-> leg 1)
      - Upload still hashes and stores SHA-256 — only the blocking gate goes.
        (-> leg 2)
      - Reconciliation closes; removals traceable to the named classes. (-> all)
      - Sweep clean; census no new rules. (-> all)
      - Verified means: baseline clean + no new warnings + full pass +

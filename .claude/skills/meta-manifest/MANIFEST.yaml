  # ─── Project nodes (discovered through use) ───────────────────────────────
  # Naming convention: [layer]-[name]/SKILL.md
  # Exception: CLAUDE.md is loaded by Claude Code natively, not via the SKILL.md
  # discovery loader. The project-instructions index node points at it directly.
  #
  # Phase vocabulary (use exact values):
  #   always          — active in all phases (foundation, antidrift)
  #   pre-build       — governs before implementation begins
  #   during-build    — governs during implementation
  #   post-build      — governs after implementation completes
  #   [pre-build, post-build]  — active in multiple specific phases


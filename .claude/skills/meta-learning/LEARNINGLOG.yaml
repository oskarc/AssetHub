    diffs:
      - dimension: pattern
        assumption: "A feature has one consumer, so cutting it is local"
        discovery: "GetBySha256Async served both the user-facing upload gate and the migration ingest path, where a hash match is what makes re-running an import idempotent rather than duplicating the library."
        learning: "A user-facing feature and an invisible correctness property can share one implementation. Cutting by feature name alone would have made a batch tool destructive on re-run."
        node_impact:
          - node_id: pattern-feature-excision
            action: verify
      - dimension: pattern
        assumption: "CollectionTreeHelper is part of the nesting machinery"
        discovery: "Despite the name it is a flat DTO mapper. Flatten sets Depth to zero and FlattenAll returns the list unchanged. It never implemented nesting."
        learning: "The name-versus-contents trap runs in both directions. A name can claim a feature the code does not implement, just as a container can hide contents its name disclaims."
        node_impact:
          - node_id: pattern-feature-excision
            action: verify
      - dimension: stakes
        assumption: "Removing ACL inheritance is verifiable by a green suite"
        discovery: "The 75-test ACL matrix captured before the cut returned identical after it, with only constructor wiring changed. That is what made the access-control claim checkable rather than asserted."
        learning: "Access control is exactly the kind of invariant that should be captured and diffed rather than reviewed, the same shape used for auth-annotation posture in work-011."
        node_impact:

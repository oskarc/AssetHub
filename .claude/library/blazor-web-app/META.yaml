  - pattern-brainstorm's concern boundary with plan-interrogation tooling is unclear
  - implementation-worker-background's hosting-split principle verified only on a 2-host topology
  - pattern-time-series-rollup has a single implementation; multi-pod coordination (SKIP LOCKED) referenced but unspecified
  - pattern-enum-string-persistence's untrusted-boundary leg grounded in one incident
  - implementation-commit-and-push Phase 7 assumes SonarCloud-style tooling — adapt or drop per project (carried as a worked example)
  - implementation-ui-verify's spec-mapping table is a worked example — remap to the target app's sections and spec numbering
  - The eight check/scaffold skills expect a host project's always-loaded instruction file to exist; their former dependencies on the source project's instruction node were dropped at extraction

mature_nodes: 12
thin_nodes: 19

recommended_for:
  - Server-rendered component-UI web applications on .NET (Blazor Server or similar) with a relational database, object storage, and background processing
  - Internal tools and line-of-business systems where a curated public API and role-based access control matter
  - Teams practicing kit-driven development who want a generation-1 standard to instantiate and evolve

not_recommended_for:
  - Client-heavy SPA architectures (React/Angular/Blazor WASM with API-first design) — the facade-over-in-process-services pattern does not apply
  - Microservice topologies — the layered single-deployable assumption runs throughout
  - Non-.NET stacks — implementation-layer skills are stack-specific by design


gap_queue:

  - gap_id: gap-001
    concern: blazor-web-app type-category kit is named in the manifest but not yet extracted
    surfaced_by: manual
    surfaced_in: AssetHub initial fill on v0.4 (2026-05-01), restated on v0.8 bootstrap (2026-05-19)
    description: |
      The category `blazor-web-app` now exists in kit_identity and the type-category nodes
      from old manifest are migrated as tier: type-category, inherited: false. The library
      artifact (.claude/library/blazor-web-app/META.yaml) does not exist yet — first
      extraction will produce it. Tied to gap-002 (CLAUDE.md decomposition) because
      transferable patterns currently live at the project layer (CLAUDE.md) instead of as
      their own pattern/implementation skills under the type-category tier.
      2026-06-14: decomposition started (gap-002). batch 1 of ~14 extracted
      (principle-clean-architecture-dotnet, pattern-service-result,
      implementation-csharp-conventions); CLAUDE.md sections slimmed to project-note + pointer.
      Extraction-readiness still pending the remaining ~11 skills.
    candidate_level: pattern
    priority: high
    status: in-progress

  - gap_id: gap-002
    concern: skill-builder abstraction loop has never been formally run against CLAUDE.md
    surfaced_by: manual
    surfaced_in: AssetHub initial fill on v0.4 (2026-05-01)
    description: |
      ~38 KB of guardrails accumulated organically. Some are genuine product details (PAT scopes,
      Wolverine queue names, MinIO bucket conventions); some are patterns; a handful are principles
      ("manifest is read-only", "never silently abstract"). Level-mixing per skill-builder
      Anti-patterns. Resolving gap-001 should consume this gap.
      2026-06-14: abstraction loop now running (P6). Approved decomposition map: ~14 type-category
      skills. Batch 1 done (clean-architecture-dotnet [principle], service-result [pattern],
      csharp-conventions [implementation]). Remaining batches iterate with the developer per skill.
    candidate_level: pattern
    priority: high
    status: in-progress

  - gap_id: gap-003
    concern: Information architecture and navigation decisions are silent at every layer
    surfaced_by: manual
    surfaced_in: AssetHub initial fill on v0.4 (2026-05-01)
    description: |
      No node, skill, or CLAUDE.md section addresses how to decide page hierarchy, sidebar grouping,
      breadcrumb strategy, or navigation patterns. implementation-ux-check audits heuristics for what
      already exists but not the design step that creates it.
      2026-06-12: docs/STYLEGUIDE.md (now registered as project-styleguide) documents existing IA
      conventions — remaining scope is decision guidance for NEW page hierarchies plus the admin-area
      IA review (AdminResource at 507 keys signals a tab monolith).
    candidate_level: principle
    priority: medium
    status: open

  - gap_id: gap-004
    concern: Design-system / visual-feel guidance is reduced to "MudBlazor 8 only"
    surfaced_by: manual
    surfaced_in: AssetHub initial fill on v0.4 (2026-05-01)
    description: |
      No tokens, no spacing scale, no colour usage rules, no typographic hierarchy.
      implementation-ux-check audits behaviour but not visual coherence. New components inherit
      MudBlazor defaults plus ad-hoc decisions.
      2026-06-12: the knowledge existed all along in docs/STYLEGUIDE.md (31KB — tokens, palettes,
      typography scale, IA conventions); the actual gap was registration. Now a manifest node
      (project-styleguide) with a loader pointer from CLAUDE.md § Blazor UI.
    candidate_level: pattern
    priority: medium
    status: resolved
    resolved_by: project-styleguide (registered 2026-06-12)

  - gap_id: gap-005
    concern: Verification node not formalised — coverage exists in aggregate but not as a single concern
    surfaced_by: manual
    surfaced_in: AssetHub initial fill on v0.4 (2026-05-01)
    description: |
      Eight implementation-* / pattern-* skills (a11y, ux, i18n, di, migration, add-tests,
      regression-baseline, ui-verify) plus the pre-commit grep sweep cover verification. There is no
      single node that says "before declaring a feature done, run these in this order" — the
      workflow is implicit in CLAUDE.md and the available-skills list. Risk: a feature ships missing
      a step simply because nobody looked at the full set. meta-antidrift covers post-output drift
      scoring but not pre-merge verification workflow.
    candidate_level: pattern
    priority: medium
    status: open

  - gap_id: gap-006
    concern: Concern overlap between /pattern-brainstorm and /grill-me
    surfaced_by: manual
    surfaced_in: AssetHub initial fill on v0.4 (2026-05-01)
    description: |
      Two skills target the same phase / concern with different tones. skill-builder Step 0 says
      "different concern → new skill"; if these are the same concern with different intensities they
      should either merge or split with a clearly-bounded distinction (e.g. /pattern-brainstorm for
      unclear problems, /grill-me when a plan exists and needs holes poked).
      VERIFICATION NEEDED: /grill-me no longer appears in the current available-skills list — its
      location may have changed (retired, merged into brainstorm, or still user-space only). Verify
      current state before acting on this gap.
      2026-06-12: verified — /grill-me is absent from the available-skills list; retired. No overlap
      remains to resolve.
    candidate_level: product detail
    priority: low
    status: resolved
    resolved_by: verification 2026-06-12 (/grill-me retired; pattern-brainstorm is the sole pre-build interrogation skill)

  - gap_id: gap-007
    concern: /grill-me lives in user-space only — not committed to the repo
    surfaced_by: manual
    surfaced_in: AssetHub initial fill on v0.4 (2026-05-01)
    description: |
      Teammates and CI do not inherit it. If it carries judgment this project relies on, it should
      live in `.claude/skills/pattern-grill-me/SKILL.md` like the others (and adopt the layer-prefix
      convention). Same risk applies to any future user-space skill the project comes to depend on.
      VERIFICATION NEEDED: see gap-006. If /grill-me has been retired, this gap can be marked
      resolved.
      2026-06-12: verified retired (see gap-006).
    candidate_level: product detail
    priority: low
    status: resolved
    resolved_by: verification 2026-06-12 (/grill-me retired)


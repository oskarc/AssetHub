      DESIGN CHANGED UNDER MEASUREMENT — see revisions[0]. The drawn plan would have
      silently removed language switching from a bilingual app's sign-in page.

      SIDE EFFECT, deliberate: the app-bar sign-in control became <a href> so it
      works without a circuit, changing its ARIA role from button to link. More

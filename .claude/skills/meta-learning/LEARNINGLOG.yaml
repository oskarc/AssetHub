            action: update
      - dimension: pattern
        assumption: "Removing a feature removes only what the feature owned"
        discovery: "A Keycloak role-lookup method and its cache-registry entries became unreachable because the PAT auth handler was their only consumer. They compiled and passed tests."
        learning: "Removing a source of variability turns the code that handled it into dead weight the compiler cannot see."
        node_impact:

    tier_3: |
      - Email-infrastructure boundary is hard: IEmailService, SmtpEmailService,
        EmailSettings, EmailTemplateBase, ShareCreatedEmailTemplate,
        WelcomeEmailTemplate, and share-email flows stay byte-for-byte untouched.
        (-> UC3, UC4)
      - Surviving features keep exact behavior: workflow (until C6), saved searches
        (until C11), migrations (until C8) — tests green untouched except removed
        notification mocks; behavioral test changes are stop-and-surface. (-> UC5, UC6)
      - Full pattern-feature-excision discipline: build-as-authority, warning census,
        emptied-namespace check on Components/Notifications/, survivor taxonomy,
        prose-in-same-change. (-> UC2, UC3, UC9, UC10)
      - Migration per ef-config-migration (+ discovery check) and migration-check
        audit; has-pending-model-changes clean. (-> UC7)
      - i18n parity; DI no orphans in either root; float hygiene (locks in place; any
        fresh-restore failure is still a mid-run stop). (-> all)
      - Verified means: baseline clean + zero-new-warnings non-incremental build +
        full test pass + sweep clean + compose parses. (-> UC9)
    status: implemented
    revisions: []
    work_id: null

  - contract_id: contract-007
    feature: reshape-c6-workflow-cut
    date_proposed: 2026-08-12
    date_approved: 2026-08-12
    tier_1: |

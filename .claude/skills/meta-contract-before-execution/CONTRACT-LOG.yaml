  - contract_id: contract-013
    feature: reshape-c12a-identity-alongside-keycloak
    date_proposed: 2026-08-14
    date_approved: 2026-08-14
    tier_1: |
      C12 replaces Keycloak with ASP.NET Core Identity. Split in two on the
      agent's recommendation, approved: this contract ADDS Identity alongside
      Keycloak, config-gated, leaving Keycloak the default and fully working. The
      next contract removes Keycloak once the Identity path is proven. Each
      contract ends with a system that runs.

      Three survey findings drove the split:
      1. There is NO local user table — Keycloak is the entire user store, and
         CurrentUser.UserId is a Keycloak subject string that fills
         CollectionAcl.PrincipalId, Asset.CreatedByUserId and
         AuditEvent.ActorUserId. Identity means adding seven tables and becoming
         the user store: the largest ADDITIVE change in the programme.
      2. The unit suite CANNOT gate this. CustomWebApplicationFactory:158-160
         replaces every scheme with TestAuthHandler, so all 901 tests bypass real
         authentication. Only E2E 01-auth.spec.ts (8 tests) plus the .auth
         storage states cover it, and those states are Keycloak artifacts.
      3. A single-contract swap has no working intermediate state.

      DECISION (a), approved — existing user IDs are NOT migrated. New Identity
      users get new GUIDs, so pre-existing ACL grants and audit rows would
      reference users the new store does not know and render as "Deleted User
      (xxxx)". Accepted as fresh-install semantics per D3. NOTE: this contract
      orphans nothing, because Keycloak remains the default provider — the
      consequence lands only at actual cutover (C12b).
    tier_2: |
      1. Baseline roll-forward to 4e836b3 (901); docker pre-check FIRST
         (drift-001 — it was down again, sixth occurrence). Suite starts only
         after every edit including the sweep (drift-007, five occurrences).
      2. Add Identity: AppUser : IdentityUser (string key so the existing
         user-id type is unchanged), Identity tables via one migration,
         AddIdentityCore + RoleManager, password/lockout policy in
         IdentitySettings with validate-on-start. AppUser lives in
         Infrastructure, NOT Domain — Domain has zero package references by
         standard and Identity is a NuGet type.
      3. Auth wiring: new "Identity" provider mode in AuthenticationExtensions
         selected by Auth:Provider (Keycloak | Identity), defaulting to Keycloak
         so nothing changes without opting in. Cookie scheme shared; Smart
         selector still routes bearer to JWT. Identity roles map to the same
         ClaimTypes.Role values RoleHierarchy already expects.
      4. Local auth UI: real login form, sign-out and change-password pages used
         when the provider is Identity. /auth/login, /auth/logout and
         /auth/change-password keep their paths so MainLayout and Login.razor are
         untouched.
      5. Seed on startup when provider is Identity and no users exist: one admin
         from Identity:SeedAdmin config, audited, idempotent, no-op otherwise.
      6. IUserDirectory abstraction over the four read operations the app needs
         (names, emails, lookup-by-username, list/search) with a Keycloak
         implementation delegating to today's UserLookupService and an Identity
         implementation querying AspNetUsers. Behaviour under Keycloak stays
         byte-identical.
      7. Tests: unit tests for the Identity provider path (seed, login, role
         mapping, password policy); TestAuthHandler untouched so the existing 901
         keep passing unchanged; a second E2E storage-state fixture.
      8. Prose: CLAUDE.md auth section gains the provider-mode concept; README
         quickstart notes both modes; compose unchanged (Keycloak still required
         in mode Keycloak).
    tier_3: |
      - KEYCLOAK MODE IS BYTE-IDENTICAL. With Auth:Provider=Keycloak (the
        default) the 901-test suite passes with ZERO assertion edits. (-> primary
        risk)
      - Identity mode authenticates end-to-end: seed admin logs in via the new
        form, gets correct role claims, reaches an admin-gated page, changes
        password, signs out. Demonstrated in E2E — NOT by the unit suite, which
        cannot see auth. (-> finding 2)
      - RoleHierarchy, the policies and CollectionAuthorizationService are
        untouched; the authorization layer must not know which provider issued
        the claims. Verified by re-running C11's 75-test ACL matrix identical.
      - No existing user-id column type or value changes.
      - Reconciliation closes (expect additions only); census no new rules.
      - Verified means: baseline clean + no new warnings + full pass + BOTH auth
        modes exercised in E2E + ACL matrix identical + discovery check clean on
        a fresh build.
    status: implemented
    revisions: []
    work_id: null
    implemented: 2026-08-14
    implementation_notes: >-
      Additive contract — the first in the programme that builds rather than
      cuts. ALL THREE GATES HELD: zero pre-existing tests removed or broken
      (Keycloak mode byte-identical), reconciliation closes exactly
      (901 - 0 + 8 = 909), and C11's 75-test ACL matrix is identical.

      PLAN DEVIATION, smaller than contracted: tier_2 step 6 called for a new
      IUserDirectory abstraction with callers migrated onto it. Execution found
      IUserLookupService already IS that abstraction — same shape, eight
      consumers already depending on it. So the work reduced to adding a second
      implementation (IdentityUserLookupService) and selecting by provider; zero
      consumers changed. Less churn for the same outcome.

      Architectural note: AppUser lives in Infrastructure, not Domain, because
      IdentityUser is a framework type and Domain carries zero package
      references by standard. The key stays string, so no persisted user
      reference changes type.

      Identity tables ship regardless of provider (7 tables, one migration) —
      unused under Keycloak, which keeps the schema stable across a switch.
      Discovery check clean on a fresh build.

      Census 70 -> 71 distinct, nothing outside known clusters; the one new rule
      hit (S927, parameter name must match IdentityDbContext's base) was fixed by
      renaming rather than suppressed, and the suite re-run afterwards because
      the tree had changed since the previous verdict.

      One self-inflicted test defect: the new tests took their connection string
      from GetDbConnection().ConnectionString, which Npgsql redacts the password
      from — six failures, all in new tests, none in product code. Fixed by
      deriving the per-test connection from the fixture's own string.

      drift-001 recurred a sixth time (Docker down), caught by the pre-check
      before any suite was spent.

      NOT YET DONE, deferred to C12b as contracted: the admin user-management
      surface still calls the Keycloak admin API, so under Auth:Provider=Identity
      those operations are non-functional. E2E verification of the Identity
      sign-in path also remains outstanding — the unit suite cannot cover it.

  - contract_id: contract-014
    feature: reshape-c12b-identity-admin-and-password-reset
    date_proposed: 2026-08-14
    date_approved: 2026-08-14
    tier_1: |
      Second of three. C12a made AssetHub authenticate under Identity; this makes
      it administrable under Identity. Afterwards both providers are fully
      functional and the Identity path is proven end-to-end — the precondition
      for C12c removing Keycloak.

      The dependency is smaller than its 702-line implementation suggests.
      IKeycloakUserService declares 7 methods; ResetPasswordAsync has ZERO
      callers and simply goes. Of the rest, GetRealmRoleMemberIdsAsync is the
      only one reaching outside the admin surface (CollectionAclService,
      DashboardService, UserAdminService) and is a pure read; Create/Delete/
      Assign/RemoveRole are UserAdminService-only and map one-to-one onto
      UserManager. Following C12a's lesson the abstraction already exists in the
      right shape, so the move is to make IKeycloakUserService provider-neutral
      rather than invent a new seam.

      THE HARD PART: SendExecuteActionsEmailAsync (new-user password setup and
      admin-triggered reset). Keycloak owns that entire flow — signed expiring
      token, hosted set-password page, email. Identity supplies only the token
      generator. This is a small FEATURE to build, not a substitution, and is the
      contract's main risk. Agent flagged it as the one piece worth isolating;
      owner approved keeping it in this contract.

      VERIFICATION REALITY (unchanged from C12a): the unit suite runs behind
      TestAuthHandler and cannot see any of this. E2E is the only real gate, and
      global.setup.ts currently drives a KeycloakLoginPage to mint storage
      states — so regenerating those against Identity is step one, not an
      afterthought.
    tier_2: |
      1. Baseline roll-forward to d85dcf2 (909); docker pre-check first
         (drift-001, six occurrences). Suite starts only after every edit
         including the sweep (drift-007, five).
      2. E2E FIRST: parameterise global.setup.ts on the provider — keep
         KeycloakLoginPage for Keycloak mode, add IdentityLoginPage for the local
         form, generate storage states either way.
      3. Rename IKeycloakUserService -> IUserDirectoryAdmin, drop the unused
         ResetPasswordAsync, keep the existing implementation body unchanged as
         KeycloakUserDirectoryAdmin. Update 4 consumers — mechanical.
      4. Add IdentityUserDirectoryAdmin over UserManager/RoleManager; registered
         by Auth:Provider exactly as IUserLookupService is.
      5. PASSWORD-RESET FLOW (new feature): POST /auth/forgot-password and a
         /auth/reset-password page consuming userId + token;
         PasswordResetEmailTemplate alongside WelcomeEmailTemplate; token via
         GeneratePasswordResetTokenAsync; single-use is inherent via the security
         stamp. Admin "send reset" and new-user setup both route here under
         Identity.
      6. Rename /admin/keycloak-users routes to /admin/directory-users and
         KeycloakUserDto -> DirectoryUserDto. Admin-internal, so no SemVer event.
      7. KeycloakHealthCheck becomes provider-conditional.
      8. DELETE UserSyncService and /admin/users/sync — it detects out-of-band
         Keycloak deletions; under Identity deletion goes through UserManager and
         the app knows immediately. pattern-feature-excision applies to this leg.
      9. Tests: unit coverage for IdentityUserDirectoryAdmin and the reset-token
         flow; existing suite unchanged. E2E: create user -> assign role ->
         password reset -> delete user under Identity.
      10. Prose: CLAUDE.md auth section, README quickstart. Compose unchanged
          (Keycloak still required in Keycloak mode — C12c's job).
    tier_3: |
      - KEYCLOAK MODE BYTE-IDENTICAL: zero pre-existing tests removed or broken;
        Keycloak E2E storage states still generate and pass. A rename must not
        change behaviour. (-> primary risk)
      - IDENTITY ADMIN PROVEN IN E2E: create user -> assign role -> password
        reset -> delete user. Not claimed on a green unit suite. (-> the
        verification-reality finding)
      - PASSWORD RESET SAFE BY CONSTRUCTION: token expires, is single-use, is
        never logged, and the endpoint response does not reveal whether an
        account exists. (-> the hard part)
      - GetRealmRoleMemberIdsAsync's three consumers behave identically under
        both providers; the 75-test ACL matrix re-runs identical.
      - UserSyncService removal passes the excision sweep — no orphaned
        endpoint, DTO or UI action.
      - Reconciliation closes; census no new rules.
      - Verified means: baseline clean + no new warnings + full pass +
        reconciliation + ACL matrix identical + BOTH providers' E2E green +
        discovery check clean on a fresh build.
    status: implemented
    revisions: []
    work_id: null
    implemented: 2026-08-14
    implementation_notes: >-
      ALL GATES HELD: reconciliation closes exactly (909 - 11 + 20 = 918), zero
      regressions, ACL matrix identical. The 11 "removed" tests decomposed on
      inspection into 10 RENAMES (class and route renames changing
      fully-qualified names) and exactly 1 true removal —
      Viewer_CannotSyncUsers_Returns403, which tested the endpoint this contract
      deletes. Verifying that decomposition rather than accepting the raw count
      is what the reconciliation gate is for.

      Scope discovery: tier_2 step 8 named UserSyncService and its endpoint. The
      tracer greps also found UserSyncBackgroundService (a daily hosted service)
      which died with it, and IUserCleanupService which SURVIVES — it is shared
      with the admin delete-user flow and still needed under Identity (survivor
      taxonomy: shared helper with remaining users).

      Tracer-grep gap worth noting: the excision tracer searched
      UserSync|SyncDeletedUsers|UserSyncResult and missed the endpoint test
      Viewer_CannotSyncUsers_Returns403, whose name contains "Sync" but none of
      those tokens. The suite caught it as a pre-existing failure. A tracer on
      the ROUTE string ("users/sync") would have found it.

      Password reset built with its security properties as construction
      constraints, each covered by a test: single-use (security-stamp rotation,
      replay rejected), expiring (24h data-protection default), never logged
      (user id only), non-enumerating (forgot-password always reports success;
      failed reset surfaces policy errors but stays silent on token/user
      errors).

      Self-corrections: I called an S2681 warning a "real bug" on first read —
      it was not. The unbraced `if` guards a single fluent statement, so
      behaviour was correct; Sonar was flagging misleading formatting. Braces
      added anyway. Also a test-setup gap (AddDefaultTokenProviders needs
      AddDataProtection) caused 10 new-test failures, and three census warnings
      of my own making were fixed rather than suppressed.

      drift-001 recurred a SEVENTH time and for the first time mid-session: the
      pre-check passed, then the daemon died and the final suite returned 491
      failures in 21s. Recognised, refused as data, re-run clean.

      NOT DONE, deferred to C12c as contracted: Keycloak removal (compose,
      settings, KeycloakUserDirectoryAdmin, the OIDC branch). E2E storage-state
      regeneration is wired but UNRUN — the E2E toolchain has no local
      TypeScript install, so those edits are unverified by tooling in this
      environment.

  - contract_id: contract-015
    feature: reshape-c12c-remove-keycloak
    date_proposed: 2026-08-14
    date_approved: 2026-08-14
    tier_1: |
      Last of three. C12a made AssetHub authenticate under Identity, C12b made it
      administrable. This removes Keycloak entirely — container, database,
      KeycloakSettings, KeycloakUserDirectoryAdmin, UserLookupService,
      KeycloakHealthCheck, the OIDC branch, and the whole Auth:Provider switch —
      after which Identity is simply how AssetHub authenticates.

      THE DECISION, AND IT IS THE WHOLE CONTRACT: Identity has never been
      executed. Not once. Both prior contracts are proven by unit tests running
      behind TestAuthHandler which structurally cannot see authentication, plus
      E2E wiring added but never run. Removing Keycloak now would remove the
      fallback for a replacement nobody has observed working.

      So this contract has a HARD PRECONDITION: E2E green against an
      Identity-backed stack BEFORE anything is deleted. It is a gate, not a task.
      If it fails, the contract stops and converts into a fix-Identity contract.

      Correction recorded: C12b reported "no local TypeScript toolchain, so E2E
      edits are unverified". Playwright bundles its own transpilation and Node 24
      / npm 11 are present, so the specs CAN run here. What is missing is a
      standalone typecheck — and the fact that they have never been executed
      against Identity.
    tier_2: |
      1. Baseline roll-forward to 572dbbb (918); docker pre-check first. Note
         drift-001 recurred MID-SESSION in C12b, so a healthy check at the start
         is not a guarantee.
      2. GATE — prove Identity end-to-end. Compose up with Auth:Provider=Identity
         and a seeded admin; regenerate .auth storage states via
         IdentityLoginPage; run the E2E suite. Fix what breaks. NOTHING is
         deleted until this is green. Six E2E specs currently reach Keycloak;
         which of that is storage-state plumbing versus real coupling is unknown
         until it runs.
      3. Remove the provider switch: AuthSettings, the Auth:Provider branches in
         AuthenticationExtensions / ServiceCollectionExtensions /
         WebApplicationExtensions / Login.razor. Identity becomes unconditional.
      4. Delete the Keycloak implementations: KeycloakUserDirectoryAdmin,
         UserLookupService, KeycloakHealthCheck, KeycloakSettings,
         KeycloakApiException, keycloak-login.page.ts,
         KeycloakUserDirectoryAdminTests.
      5. Compose: drop the keycloak service, volume, realm-import and theme
         mounts, init-keycloak-db.sh, the Keycloak database and credentials, and
         the KeycloakDb connection string — both compose files.
      6. Config: strip the Keycloak section from all six appsettings files; make
         Identity settings validate-on-start unconditionally.
      7. Sweep with survivor taxonomy — ClaimsPrincipalExtensions and role-mapping
         helpers expected to survive as provider-neutral; migration history
         untouched. Unreachable-branch leg on anything the removed switch made
         constant.
      8. Prose: CLAUDE.md loses the provider-modes table; README quickstart drops
         Keycloak setup; manifest note on principle-clean-architecture-dotnet's
         "OIDC is Keycloak" instantiation.
    tier_3: |
      - THE GATE IS THE CONTRACT. E2E green against Identity before any deletion.
        Not "unit tests pass" — the failure mode this guards against is invisible
        to them. (-> the decision)
      - After removal, E2E green again with no provider branching anywhere.
      - Reconciliation closes; Keycloak-specific test classes are the expected
        removals.
      - No route loses authorization: re-run C10's auth-annotation capture,
        posture identical.
      - ACL matrix re-runs identical.
      - Sweep clean; census no new rules.
      - Verified means: E2E green under Identity BOTH before and after the cut +
        full unit pass + reconciliation + auth posture identical + ACL matrix
        identical + compose parses + discovery check clean.
    status: approved
    revisions: []
    work_id: null

  - work_id: work-005
    feature: reshape-c4-webhooks-cut
    contract_id: contract-005
    surfaced_in: 2026-08-11
    states:
      contracted:
        approach: delete webhook machinery; detach seven publisher call sites with surrounding flows byte-for-byte intact (tests untouched bar); OutboundUrlGuard survives for the migration connector
        principles_invoked: [nothing-user-observable-changes bar]
        patterns_invoked: [pattern-regression-baseline, pattern-feature-excision (in gestation)]
        assumptions:
          - "A green suite run is a valid verdict"
          - "Detachment is five parts per site: ctor param, calls, helpers, suppression texts, mocks"
      implemented:
        approach: as contracted; zero revisions; predictable orphans shed (payload-only helper, guard flag, dangling conditional)
        deviations: []
      verified:
        method: tests
        result: pass
        evidence: "1358/1358 green, zero regressions, 25 removals all webhook-named @ 04e2ac7; owner confirmed 2026-08-11"
    diffs:
      - dimension: implementation
        assumption: "A suite run's verdict is valid whenever it completes"
        discovery: "Docker daemon down produced 667 identical failures in 10s — the second such incident; an invalid verdict, not a red one"
        learning: "The verification gate's preconditions are part of the gate; runtime-down is an abort, never data"
        node_impact:
          - node_id: pattern-regression-baseline
            action: update
      - dimension: pattern
        assumption: "The five-part detachment checklist is complete"
        discovery: "Held — plus it predictably sheds orphans the warning census catches"
        learning: "Cross-cutting detachment confirmed as an excision sub-case with its checklist and untouched-tests bar"
        node_impact:
          - node_id: pattern-feature-excision
            action: update
    elevation_proposal:
      - target: pattern-regression-baseline
        kind: implementation
        evidence: diffs[0]
        human_decision: approved
      - target: pattern-feature-excision
        kind: pattern
        evidence: diffs[1]
        human_decision: approved

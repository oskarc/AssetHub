  - work_id: work-010
    feature: reshape-c9-metadata-schema-engine-cut
    contract_id: contract-010
    surfaced_in: 2026-08-14
    states:
      contracted:
        approach: remove the admin-defined metadata engine; keep tags and technical metadata; search reverts to simpler
        principles_invoked: [pattern-feature-excision]
        patterns_invoked: [pattern-feature-excision, implementation-ef-config-migration]
        assumptions:
          - "The migration is five DropTable calls in foreign-key order"
          - "Search reverting to simpler is a code change"
      implemented:
        approach: as contracted, plus a database-level rewrite the contract did not anticipate
        deviations:
          - "Migration additionally drops two triggers and their functions, replaces assets_refresh_search_vector, and reindexes existing rows before dropping any table"
          - authorized: true
      verified:
        method: tests
        result: pass
        evidence: "Suite 1013 passed and 0 failed at d9f9931; reconciliation 1083 minus 70 plus 0; discovery check clean on a fresh build."
    diffs:
      - dimension: implementation
        assumption: "The migration is five DropTable calls in foreign-key order"
        discovery: "The full-text search vector was computed by a PL/pgSQL function joining two of the doomed tables, with two triggers on them. A plain drop would have failed on the dependent triggers and left the function referencing missing relations, breaking every asset insert."
        learning: "A schema drop must account for database-level dependents (functions, triggers, views, generated columns), not only foreign-key order. These live in the database rather than the codebase, so neither the compiler nor a source grep reveals them; the migration history and the database catalogue are the only places they appear."
        node_impact:
          - node_id: implementation-ef-config-migration
            action: update
          - node_id: implementation-migration-check
            action: update
      - dimension: pattern
        assumption: "A contract tier 2 enumerates the work"
        discovery: "Tier 2 said drop five tables. Execution found the coupling only because a surviving test named the trigger behaviour, and reading the original migration SQL was necessary to write the replacement."
        learning: "For a feature with database-level machinery, the contract survey must read the migration that created it, not only the code that uses it."
        node_impact:
          - node_id: pattern-feature-excision
            action: update
    elevation_proposal:
      - target: implementation-migration-check
        kind: implementation
        evidence: "diffs[0]. NOT YET ELEVATED. The migration standards cover reversibility and discoverability but say nothing about database-level dependents of a dropped table."
        human_decision: pending


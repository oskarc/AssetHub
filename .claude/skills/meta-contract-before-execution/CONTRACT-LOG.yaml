      consumer already share one process (contract-019), so a broker is apparatus.

      THE SURVEY DE-RISKED THIS. Media commands already flow through a DURABLE
      OUTBOX (IOutboxPublisher.EnqueueAsync -> OutboxMessage table ->
      OutboxDrainService), not direct to Rabbit. Producer durability already
      exists; Rabbit was largely redundant with the outbox (in place since April).

      Wolverine features in use and their replacements: transport -> Channel<T> +
      a dispatcher; retry-with-cooldown -> the outbox's AttemptCount/RecordFailure
      (drain re-attempts) plus in-dispatcher retry; handler auto-discovery ->
      explicit command->handler dispatch; cascading events (handlers return
      object[]) -> dispatcher re-publishes returned events; durable delivery ->
      the outbox, unchanged.

      DURABILITY DECISION (owner-approved): in-memory Channels + keep the outbox +
      ADD a stuck-Processing reaper. The outbox marks a row dispatched the moment
      the transport accepts it; Rabbit redelivered on crash, in-memory does not, so
      a dispatched-but-not-completed message leaves an asset stuck in Processing
      forever — and there is NO reaper today (StaleUploadCleanupService covers only
      'uploading'). The reaper re-enqueues stuck assets via the outbox and is
      end-state-correct (self-healing for any stuck cause). ZIP stays ephemeral and
      re-clickable. Wolverine durable local queues rejected as a redundant second
      persistence layer.
    tier_2: |
      1. Baseline 694 unit / E2E 53 at 1a8de05; docker pre-check.
      2. IAppMessageBus + InProcessMessageBus (unbounded Channel<object>).
      3. MessageDispatcherService (hosted): read channel, scope-per-message, explicit
         command->handler dispatch, re-publish returned object[] events, retry with
         the 1-2-5-10-30s cooldown then log+drop (media covered by the reaper).
      4. Point producers at IAppMessageBus: OutboxDrainService and ZipBuildService.
      5. Remove the UseWolverine block from Program.cs; explicit handler registration.
      6. StuckProcessingReaperService: assets in Processing beyond a threshold get
         re-enqueued via the outbox.
      7. Remove WolverineFx* packages; RabbitMQ from both compose files + settings.
      8. Invariant: the 6 message types still flow producer->handler->event.
    tier_3: |
      - Upload -> thumbnail works in the container (image, video, audio).
      - A kill mid-processing leaves the asset RECOVERABLE (reaper re-enqueues),
        not stuck in Processing — demonstrated.
      - ZIP build + all background services intact.
      - No WolverineFx or RabbitMQ reference in source, csproj, or compose.
      - Unit suite 694, zero regressions; E2E 53 green.
    invariant_capture_before: |
      commands (4): ProcessImageCommand, ProcessVideoCommand, ProcessAudioCommand,
                    BuildZipCommand
      events (2):   AssetProcessingCompletedEvent, AssetProcessingFailedEvent
      handlers (6): ProcessImage/Video/Audio (return object[]), BuildZip (Task),
                    AssetProcessingCompleted/Failed (Task)
      producers:    MediaProcessingService->outbox; ZipBuildService->direct publish;
                    handlers->cascading events
    status: implemented
    implemented: 2026-09-03
    revisions: []
    work_id: null
    outcome: |
      RabbitMQ + Wolverine removed; messages travel over an in-process channel.
      New: IAppMessageBus/InProcessMessageBus (unbounded channel),
      MessageDispatcherService (explicit 6-way dispatch, 1-2-5-10-30s retry,
      cascading-event re-publish), StuckProcessingReaperService. Rewired:
      OutboxDrainService + ZipBuildService publish to the in-process bus; handlers
      de-Wolverined; Program.cs registers all. Removed: 3 WolverineFx packages,
      RabbitMQSettings, Dockerfile.RabbitMQ, and every Rabbit trace from both
      compose files + .env. Compose 7 services (prod 6), no broker.

      CONTAINER-PROVEN, and the durability promise proven on REAL data: the reaper
      found 4 assets genuinely stuck in Processing (left by earlier probes;
      unrecoverable under the old code, which had no reaper), re-enqueued them via
      the outbox, and the full in-process pipeline ran them to `ready` — command ->
      ProcessImageHandler -> cascading completion event -> AssetProcessingCompleted
      Handler. Fresh upload journey green (upload -> ready). Unit 694, zero
      regressions. E2E 53 green.

      DELIVERY-SEMANTICS CHANGE, on record: at-most-once per dispatch + retry;
      durability is now the outbox + reaper, not broker redelivery. Sound for media
      (outbox holds the command, reaper recovers a lost dispatch). ZIP is
      at-most-once with no reaper — a lost job is re-clickable, the accepted trade.

      ADJACENT FIX: the E2E dialog-close flake documented-but-undiagnosed in
      contract-020 was root-caused here — DialogHelper.closeDialog clicked a
      re-rendering button and timed out on stability; switched to Escape. Confirmed
      NOT a contract-026 regression (messaging cannot affect dialog-close, and the
      failure reproduced with the reaper idle). Debt from contract-020 closed.

  - contract_id: contract-027
    feature: drop-redis
    reshape_step: C14
    date_proposed: 2026-09-03
    date_approved: 2026-09-03
    tier_1: |
      Remove Redis. It served two roles: HybridCache L2 (distributed cache) and a
      SignalR backplane for multi-instance Blazor Server. Both are already
      conditional on Redis:ConnectionString; the L2 falls back to
      AddDistributedMemoryCache, the backplane simply skips.

      THE MULTI-INSTANCE STORY ALREADY DIED WITH CONTRACT-026. In-process channels
      cannot span instances, so the app has been single-instance-only since C13b
      regardless of the backplane. Dropping Redis makes that explicit rather than
      introducing a new constraint. HybridCache stays (L1 in-memory + in-memory
      distributed backing); the CacheKeys registry and all tag invalidation are
      unchanged - only the L2 store changes from Redis to in-memory.
    tier_2: |
      1. Baseline 694 unit / E2E 53 at 1c86519; docker pre-check.
      2. Remove the SignalR Redis-backplane block.
      3. HybridCache: drop the Redis L2 conditional, always AddDistributedMemoryCache.
      4. Remove RedisSettings, the Redis health check, 3 Redis packages, Redis from
         both compose files + .env.
      5. Confirm HybridCache still works (get/set/tag-invalidate) in the container.
    tier_3: |
      - Cached reads still work; a write still invalidates by tag (dashboard/
        collection flows exercised in the container).
      - App starts with no Redis container; compose has one fewer service.
      - No Redis/StackExchange reference in source, csproj, or compose.
      - Unit suite 694, zero regressions; E2E 53 green.
    status: implemented
    implemented: 2026-09-03
    revisions: []
    work_id: null
    outcome: |
      Redis removed. HybridCache stays with an in-memory distributed L2
      (AddDistributedMemoryCache); CacheKeys registry + tag invalidation unchanged.
      SignalR Redis backplane removed — the app was already single-instance since
      contract-026's in-process bus, so the backplane was vestigial. Removed 3
      Redis packages, RedisSettings, the Redis health check, the Redis section from
      all 7 appsettings, and every Redis trace from both compose files + .env.

      Container-verified: 6-service stack starts clean with no Redis, no cache
      errors, health check is postgres+minio+clamav. Unit 694 zero regressions,
      E2E 53 green (the create/upload journeys exercise HybridCache get/set +
      tag-invalidation, so green confirms caching works on the in-memory L2).

      Compose is now 6 services (prod 5), down from 9 at the start of the C13b/C14
      arc — C15's slim-compose target is largely reached as a side effect; what
      remains for C15 is deciding whether clamav/mailpit/aspire-dashboard are
      optional.

      Also corrected CLAUDE.md's overview + messaging bullet, which still declared
      RabbitMQ (via Wolverine) and Redis as in use — both false since C13b/C14.
    compose_services: dev 6 (api, postgres, minio, clamav, mailpit, aspire-dashboard), prod 5

  - contract_id: contract-028
    feature: slim-startup-to-essential-services
    reshape_step: C15
    date_proposed: 2026-09-03
    date_approved: 2026-09-03
    tier_1: |
      A developer clones AssetHub to understand and work on it. Today, starting it
      launches six background services; only three are actually needed to run the
      app, and a newcomer can't easily tell which of the other three they need or
      why they're there. They want to start the app with the least ceremony and
      have it just work - and, when they need the full setup, turn the extras on
      deliberately.

      Success: the default "start" command brings up the smallest system that fully
      works. The three extras (virus scanning, local test email, a monitoring
      dashboard) are clearly opt-in.

      Cost if absent: every newcomer meets six services of unclear necessity -
      friction against the reshape's aim of a repo you grasp in an afternoon. It is
      also the last piece of shrinking the operational footprint, after messaging
      and cache already cut it from nine services to six.
    tier_2: |
      1. Start the app the default way. The developer runs the ordinary start
         command -> the three essential services (database, file storage, app) come
         up and the app is fully usable: sign in, create a collection, upload an
         image, get a thumbnail. Edge: uploads succeed with scanning off, because no
         scanner is present in this minimal setup.
      2. Start the full setup. The developer/operator runs the start command with the
         "full" option -> all six services come up, and uploaded files are virus-scanned.
      3. Failure state to prevent - broken uploads. Scanning must never be left ON
         while the scanner is absent (that refuses every upload). The minimal setup
         therefore starts with scanning OFF, tied to the scanner not being present.
      4. Failure state to prevent - unscanned uploads. No one should reach "files
         upload but aren't scanned" by disabling scanning to work around a missing
         scanner. Scanner-present and scanning-on stay a single switch, so that state
         is unreachable.
      5. Understand how to start it. A developer reading the run instructions can tell
         at a glance which command gives the minimal system and which gives the full one.
    tier_3: |
      - Core services (database, storage, app) start unconditionally; scanner,
        test-email, and dashboard are gated behind a compose profile (use cases 1 & 2).
      - The app's startup dependency on the scanner is removed, since the scanner may
        be absent (use case 1).
      - The scanning-enabled flag defaults off in the minimal stack; the full profile
        turns the scanner and the flag on together (use cases 3 & 4 - the coupling that
        makes both failure states unreachable).
      - No application code changes - compose and configuration only.
      - Run instructions in CLAUDE.md, README, and the deployment doc show both start
        commands (use case 5).
    status: implemented
    implemented: 2026-09-03
    revisions:
      - date: 2026-09-03
        note: >-
          Owner-authorized clarification: tier_3 said "both compose files", but the
          user scenario (tier_1) is a newcomer running it locally. Production must
          keep its full security posture, so docker-compose.prod.yml is left
          UNCHANGED - scanner required, scanning on, all services up. C15's slimming
          applies only to the dev stack (docker-compose.yml). Owner: "that is fine,
          we can leave it on in prod."

    work_id: null
    outcome: |
      Dev startup slimmed to the three essential services. docker compose up ->
      api + postgres + minio (verified: exactly 3 running). clamav, mailpit and
      aspire-dashboard are profile-gated ("full"); the app dropped its startup
      dependency on clamav; scanning defaults OFF in the minimal stack
      (CLAMAV_ENABLED :-false, and the .env forced-true removed) and the documented
      full command couples scanner + scanning: CLAMAV_ENABLED=true docker compose
      --profile full up.

      USE CASES VERIFIED IN THE CONTAINER: (1) minimal stack fully usable - the
      journeys and the full E2E (53) pass against 3 services, upload->thumbnail with
      scanning off; (2) full command resolves scanner-up + scanning-on (config
      verified; scan path unit-tested); (3) no broken uploads - default resolves
      scanning false; (4) no silently-unscanned - flag explicit, coupled in the full
      command; (5) README + DEPLOYMENT show both start commands.

      Prod compose LEFT UNCHANGED per owner authorization (revisions[0]) - production
      keeps its full security posture. No application code touched. Unit 694 (compose
      -only), E2E 53 green. Also fixed a stale Keycloak hosts line in DEPLOYMENT.md.

      Compose footprint across the C13b->C15 arc: 9 services -> default 3 (full 6),
      prod 5. The reshape's operational-slimming goal is reached.

  - contract_id: contract-029
    feature: squash-migrations-to-initial
    reshape_step: C16
    date_proposed: 2026-09-03
    date_approved: 2026-09-03
    tier_1: |
      A developer opens AssetHub to understand it. Nearly half the repository -
      57,276 lines across 51 files - is generated EF migration history, most of it
      for features the reshape has since removed. It buries the actual code and
      makes the repo look far larger and older than the system it now describes.
      They want the schema defined once, cleanly, reflecting what the database IS
      today. Success: one InitialCreate migration builds the current schema and the
      repo roughly halves; the app still starts and migrates a fresh DB as before.
      Cost if absent: the single biggest obstacle to "understand it in an afternoon"
      remains.
    tier_2: |
      1. Fresh start. Developer starts the app against an empty DB -> the single
         squashed migration builds the complete schema and the app runs. Failure to
         prevent: the squashed schema must be IDENTICAL to what the 51 migrations
         produced (tables, columns, indexes, constraints).
      2. Full-text and fuzzy search still work. Searching assets by title/tags
         returns results. Edge: depends on raw SQL (pg_trgm extension, search_vector
         tsvector trigger, GIN indexes) that EF model-regeneration does NOT capture -
         must be carried into the squash by hand or search silently breaks.
      3. Unique names + referential integrity hold. Duplicate collection name
         rejected; orphaned shares impossible -> the raw-SQL unique index and check
         constraints survive the squash.
      4. The reset is understood. Any existing DB (dev included) no longer matches the
         single-migration history and must be recreated. This is why the
         no-live-deployments confirmation gates the contract.
    tier_3: |
      - The squashed InitialCreate produces a BYTE-IDENTICAL schema to the 51
        migrations - verified by pg_dump of a DB built from the 51 vs a DB built from
        the squash; the diff must be empty (correctness authority, use cases 1-3).
      - All raw migrationBuilder.Sql producing the CURRENT schema preserved; raw SQL
        for removed features not carried forward.
      - has-pending-model-changes clean afterward.
      - Down is a full teardown (reversible); app auto-migrates a fresh DB on startup.
      - No application code, DbContext, or entity changes - migration-history only.
    approval_note: >-
      No live deployments confirmed by owner ("yeah there is no live deploys, you may
      go ahead"). The squash resets any DB holding the old 51-migration history.
    status: implemented
    implemented: 2026-09-03
    revisions: []
    work_id: null
    outcome: |
      47 migrations (97 files, ~55k lines) squashed to one InitialCreate. Repo
      change: -55,397 / +740.

      CORRECTNESS PROVEN five ways: (1) normalized schema diff EMPTY - a DB built
      from the 47 migrations vs one built from the squash are functionally identical
      (every table, column with type/nullability/default, index, constraint,
      function, trigger, and the pg_trgm extension); the only textual differences are
      column order and whitespace, which have no behavioural effect. (2)
      has-pending-model-changes clean. (3) One migration file. (4) The app boots a
      fresh DB from the single migration; pg_trgm + both search triggers + both
      functions present. (5) Unit suite 694 GREEN on fresh Testcontainers DBs
      applying ONLY the squashed migration - including the tsvector search tests,
      which would fail if the preserved raw SQL were missing.

      The raw SQL EF's model-regeneration does not produce was carried into the
      squash by hand and verified by the diff: pg_trgm extension, the two
      search_vector functions, the two triggers, and three column defaults (Tags
      '{}', CurrentVersionNumber 1, PasswordVersion 0). Down tears the raw objects
      down in reverse.

      NOT DONE - full E2E: resetting the dev DB to prove container auto-migration
      wiped the "testuser" viewer account, which has NO reproducible seed (it was a
      manually-created dev user). auth-setup fails without it, blocking the suite.
      This is a pre-existing test-environment gap the reset exposed, orthogonal to
      the squash. Recommend a small follow-up: seed a dev/test viewer in
      IdentitySeeder so the E2E gate is reproducible. Attempting to re-provision via
      the admin UI + mailpit reset flow proved fragile and was stopped as
      out-of-scope over-investment; the squash correctness does not depend on it.

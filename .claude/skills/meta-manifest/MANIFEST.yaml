# MANIFEST.yaml
# Project instance data. Governed by meta-manifest/SKILL.md.
# Generated by meta-bootstrap — not filled manually by the developer.
# Updated only through the skill-builder process with developer approval.

kit_identity:
  kit_name: assethub
  kit_type: project
  category: blazor-web-app
  version: 0.1
  parent_kit: base-building-kit
  library_kit: null
  status: active

nodes:

  # ─── Base building kit (inherited — do not modify) ────────────────────────

  - id: base-foundation
    concern: Philosophical foundation and operational frame
    skill_file: meta-foundation/SKILL.md
    layer: meta
    phase: always
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-bootstrap
    concern: First-run installation — introduces the practice, checks library, establishes authority, creates project manifest
    skill_file: meta-bootstrap/SKILL.md
    layer: meta
    phase: pre-build
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Already run. Not invoked again.

  - id: base-contract
    concern: Contract before execution — three-tier proposal, approval gate, standard evolution report
    skill_file: meta-contract-before-execution/SKILL.md
    layer: meta
    phase: [pre-build, post-build]
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-skill-builder
    concern: Abstraction loop — classifying learnings, updating skills, raising the standard
    skill_file: meta-skill-builder/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-contract]
    open_gaps: []

  - id: base-manifest
    concern: Kit topology — node registry, coverage map, gap tracking, self-organisation
    skill_file: meta-manifest/SKILL.md
    data_file: meta-manifest/MANIFEST.yaml
    layer: meta
    phase: pre-build
    status: mature
    dependencies: []
    open_gaps: []

  - id: base-extract
    concern: Type-category kit extraction — separates transferable nodes from project nodes, produces library artifact and META.yaml
    skill_file: meta-extract/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-manifest, base-skill-builder]
    open_gaps: []
    note: Run when developer decides type-category nodes are mature enough for the library.

  - id: base-antidrift
    concern: Post-output drift scoring — compact evidence-based check against governing aspects and active skills after every output
    skill_file: meta-antidrift/SKILL.md
    layer: meta
    phase: always
    status: mature
    dependencies: [base-foundation]
    open_gaps: []
    note: Runs after every output. Makes drift visible so the human can accept or aim higher.

  - id: base-antidrift-expand
    concern: Session-level drift analysis — full pattern mapping, implicit approval accumulation, discipline fall point, elevation vs recovery assessment
    skill_file: meta-antidrift-expand/SKILL.md
    layer: meta
    phase: post-build
    status: mature
    dependencies: [base-antidrift, base-foundation]
    open_gaps: []
    note: Invoked explicitly by the human for re-orientation conversations and skill-builder passes.

  # ─── Inherited type-category nodes ────────────────────────────────────────
  # Populated by meta-bootstrap if a library kit was integrated.
  # Each node is copied from .claude/library/[category]/META.yaml.
  #
  # - id: [node-id]
  #   concern: [concern from library META.yaml]
  #   skill_file: [layer]-[name]/SKILL.md
  #   tier: type-category
  #   layer: [principle | pattern | implementation]
  #   phase: [pre-build | during-build | post-build]
  #   status: [as per library META.yaml]
  #   inherited: true
  #   inherited_from: [library kit name and version]
  #   dependencies: []
  #   open_gaps: []

  # ─── Type-category nodes (new in this project) ───────────────────────────
  # Created here, will be extracted into the blazor-web-app library kit at meta-extract time.
  # Carry inherited: false until first extraction.

  # CLAUDE.md decomposition (gap-001/002) — batch 1 of ~14, extracted 2026-06-14.
  - id: principle-clean-architecture-dotnet
    concern: Layered .NET architecture — Domain/Application/Infrastructure + thin composition-root hosts; dependency direction, deliberately-omitted patterns, SOLID application
    skill_file: principle-clean-architecture-dotnet/SKILL.md
    tier: type-category
    layer: principle
    phase: pre-build
    status: thin
    inherited: false
    dependencies: []
    open_gaps:
      - Extracted from CLAUDE.md 2026-06-14; not yet exercised as a standalone skill across a fresh feature

  - id: pattern-service-result
    concern: Services report business outcomes as ServiceResult values (not exceptions); single boundary translation to HTTP via .ToHttpResult()
    skill_file: pattern-service-result/SKILL.md
    tier: type-category
    layer: pattern
    phase: [pre-build, during-build]
    status: thin
    inherited: false
    dependencies: []
    open_gaps:
      - Extracted from CLAUDE.md 2026-06-14; in-process-facade exception-translation variant noted but unverified elsewhere

  - id: implementation-csharp-conventions
    concern: Mechanical C# conventions — null style, sealing, readonly/static, banned constructs, idiomatic surface; many map to Sonar rules
    skill_file: implementation-csharp-conventions/SKILL.md
    tier: type-category
    layer: implementation
    phase: during-build
    status: thin
    inherited: false
    dependencies: []
    open_gaps:
      - Extracted from CLAUDE.md 2026-06-14; arguably broader than blazor-web-app (any C# project) — tier boundary worth revisiting at extraction

  - id: principle-encode-over-document
    concern: When a documented rule regresses twice, encode it as a type/helper/tool-checked structure instead of strengthening the documentation
    skill_file: principle-encode-over-document/SKILL.md
    tier: type-category
    layer: principle
    phase: [pre-build, during-build]
    status: thin
    inherited: false
    dependencies: []
    open_gaps:
      - Single origin occurrence (2026-06-12 whole-app review) — escalation ladder unverified across further cases

  - id: pattern-brainstorm
    concern: Socratic interrogation of feature requests — surface real problem before code
    skill_file: pattern-brainstorm/SKILL.md
    tier: type-category
    layer: pattern
    phase: pre-build
    status: thin
    inherited: false
    dependencies: []
    open_gaps:
      - Concern boundary with /grill-me unclear (carried from old gap-006)

  - id: pattern-systematic-debug
    concern: Stack-agnostic debugging workflow — reproduce, isolate, hypothesise, test, fix, verify
    skill_file: pattern-systematic-debug/SKILL.md
    tier: type-category
    layer: pattern
    phase: during-build
    status: mature
    inherited: false
    dependencies: []
    open_gaps: []

  - id: pattern-commit-scope
    concern: Decision support for splitting a branch into multiple commits
    skill_file: pattern-commit-scope/SKILL.md
    tier: type-category
    layer: pattern
    phase: post-build
    status: mature
    inherited: false
    dependencies: []
    open_gaps: []

  - id: pattern-regression-baseline
    concern: Separating new test regressions from pre-existing failures
    skill_file: pattern-regression-baseline/SKILL.md
    tier: type-category
    layer: pattern
    phase: post-build
    status: mature
    inherited: false
    dependencies: []
    open_gaps: []

  - id: pattern-time-series-rollup
    concern: Pre-aggregating time-bounded events into a rollup table that survives source-table retention
    skill_file: pattern-time-series-rollup/SKILL.md
    tier: type-category
    layer: pattern
    phase: [pre-build, during-build]
    status: thin
    inherited: false
    dependencies: []
    open_gaps:
      - Single occurrence so far (T5-ANL-01) — pattern shape unverified across multiple features
      - Multi-pod coordination via SKIP LOCKED referenced as future optimisation, not specified

  - id: pattern-hash-keyed-pii-reveal
    concern: Indexable hash + encrypted ciphertext + audited reveal — group over PII without leaking it into the audit log
    skill_file: pattern-hash-keyed-pii-reveal/SKILL.md
    tier: type-category
    layer: pattern
    phase: [pre-build, during-build]
    status: mature
    inherited: false
    dependencies: []
    open_gaps: []

  - id: implementation-a11y-check
    concern: Accessibility audit (WCAG 2.2 AA) of changed Blazor UI
    skill_file: implementation-a11y-check/SKILL.md
    tier: type-category
    layer: implementation
    phase: post-build
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps: []

  - id: implementation-ux-check
    concern: Usability review against Nielsen heuristics + project house rules
    skill_file: implementation-ux-check/SKILL.md
    tier: type-category
    layer: implementation
    phase: post-build
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps:
      - Mixed type-category and project-specific content — decomposition candidate (carried from old gap-001/002)

  - id: implementation-i18n-check
    concern: Localisation key parity and hardcoded-string detection across .resx pairs
    skill_file: implementation-i18n-check/SKILL.md
    tier: type-category
    layer: implementation
    phase: post-build
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps: []

  - id: implementation-di-check
    concern: DI registration consistency — Application interfaces vs Service / Infrastructure extensions
    skill_file: implementation-di-check/SKILL.md
    tier: type-category
    layer: implementation
    phase: post-build
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps:
      - Mixed type-category and project-specific content — decomposition candidate (carried from old gap-001/002)

  - id: implementation-migration-check
    concern: EF Core migration safety audit before auto-migrate at startup
    skill_file: implementation-migration-check/SKILL.md
    tier: type-category
    layer: implementation
    phase: post-build
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps: []

  - id: implementation-add-tests
    concern: xUnit / bUnit test scaffolding for new or changed code
    skill_file: implementation-add-tests/SKILL.md
    tier: type-category
    layer: implementation
    phase: post-build
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps:
      - Mixed type-category and project-specific content — decomposition candidate (carried from old gap-001/002)

  - id: implementation-ui-verify
    concern: E2E (Playwright) smoke-test mapping for changed Blazor UI
    skill_file: implementation-ui-verify/SKILL.md
    tier: type-category
    layer: implementation
    phase: post-build
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps: []

  - id: implementation-commit-and-push
    concern: Commit hygiene — review staged changes, run build / tests, compose why-focused commit message
    skill_file: implementation-commit-and-push/SKILL.md
    tier: type-category
    layer: implementation
    phase: post-build
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps:
      - Mixed type-category and project-specific content — decomposition candidate (carried from old gap-001/002)

  # ─── Project nodes (discovered through use) ───────────────────────────────
  # Naming convention: [layer]-[name]/SKILL.md
  # Exception: CLAUDE.md is loaded by Claude Code natively, not via the SKILL.md
  # discovery loader. The project-instructions index node points at it directly.
  #
  # Phase vocabulary (use exact values):
  #   always          — active in all phases (foundation, antidrift)
  #   pre-build       — governs before implementation begins
  #   during-build    — governs during implementation
  #   post-build      — governs after implementation completes
  #   [pre-build, post-build]  — active in multiple specific phases

  - id: project-instructions
    concern: AssetHub project guardrails — Clean Arch boundaries, C# conventions, domain entities, services, repositories, API endpoints, Blazor UI, caching, worker, security, configuration, testing, Docker, Sonar discipline, pre-commit grep sweep
    skill_file: CLAUDE.md
    tier: project
    layer: implementation
    phase: [pre-build, during-build, post-build]
    status: thin
    inherited: false
    dependencies: [base-contract, base-skill-builder, base-manifest]
    open_gaps:
      - Type-category-shaped guidance not yet decomposed into pattern/implementation skills under the blazor-web-app category
      - Level-mixed — principles, patterns, and product details combined in one file (skill-builder anti-pattern)
    note: Auto-loaded by Claude Code natively. The [layer]-[name]/SKILL.md naming convention does not apply. Decomposing this node into smaller principle/pattern/implementation skills is the largest standing skill-builder programme for this project. Truth-passed 2026-06-12 (post-loopback architecture corrections — facade contract, error idiom, hybrid optimistic rule, Api/Worker hosting split, per-entity DbContext config).

  - id: project-styleguide
    concern: Design system — tokens, palettes, typography scale, elevation, component patterns, IA conventions
    skill_file: docs/STYLEGUIDE.md
    tier: project
    layer: implementation
    phase: [pre-build, during-build]
    status: mature
    inherited: false
    dependencies: [project-instructions]
    open_gaps: []
    note: Lives at repo docs/STYLEGUIDE.md, loaded via the CLAUDE.md § Blazor UI pointer (wired 2026-06-12). Not a SKILL.md loader file.


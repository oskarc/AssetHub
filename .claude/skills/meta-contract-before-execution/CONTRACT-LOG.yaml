  - contract_id: contract-016
    feature: fix-blazor-static-assets
    date_proposed: 2026-08-14
    date_approved: 2026-08-14
    tier_1: |
      The containerised app has no working interactive UI.
      /_framework/blazor.web.js returns 404 even with a valid session, so the
      Blazor circuit never starts: no menus, no dialogs, no buttons. Everything
      server-rendered looks correct, which is why it went unnoticed. Found while
      running the C12c gate; it is why 2 of 15 E2E tests fail. Not an auth
      problem and not caused by the reshape.

      Diagnosis stated as a HYPOTHESIS, not a fact: MapStaticAssets() appears
      nowhere in source and the published endpoints manifest looked nearly empty.
      From .NET 9 the Blazor script moved to the MapStaticAssets() pipeline. That
      fit the symptoms but was unproven, so confirming the root cause was step
      one rather than an assumption baked into the plan.

      Sequenced before C13 because the unit suite structurally cannot see UI or
      auth — E2E is the only real gate for either, and C13 folds the Worker into
      the Api. Fix the gate before leaning on it.
    tier_2: |
      1. Baseline roll-forward to bc3e75c (909); docker pre-check first.
      2. CONFIRM THE ROOT CAUSE BEFORE CHANGING ANYTHING. Reproduce outside
         Docker against the published output; inspect what the manifest actually
         contains versus what MapRazorComponents expects. If the cause is
         something other than the missing MapStaticAssets(), the plan below is
         wrong and I stop and re-draw.
      3. Adopt the current pipeline: app.MapStaticAssets() ahead of
         MapRazorComponents<App>(), reconciled with the existing UseStaticFiles().
      4. Verify the published manifest carries the framework routes and that
         /_framework/blazor.web.js returns 200 with an executable content-type.
      5. Re-check the UseBlazorAnonymousAccess carve-out once assets are served
         by endpoint routing rather than middleware.
      6. Tests: the two circuit-dependent E2E specs pass; add a smoke assertion
         that the framework script returns 200 so this cannot silently regress.
      7. Sweep for other assets the same gap hid — scoped CSS, _content/.
    tier_3: |
      - /_framework/blazor.web.js returns 200 with an executable content-type in
        the container, authenticated and anonymous.
      - The circuit connects: window.Blazor exists and a menu opens in a browser.
      - E2E green: all 15 @auth chromium tests.
      - Scoped CSS resolves with no MIME-type console errors.
      - Unit suite unchanged at 909 with zero assertion edits — hosting fix, not
        behaviour change.
      - Census no new rules; both compose files parse.
    status: stopped
    stopped: 2026-08-14
    work_id: null
    stop_reason: >-
      Tier_2 step 2 was an explicit stop-and-redraw gate. That condition fired:
      adding MapStaticAssets() did NOT resolve the 404, so tier_2 steps 3-7 rest
      on a wrong diagnosis. Contract stopped with the tree clean — no partial fix
      left behind, nothing committed.

      What the investigation ESTABLISHED (measured, not inferred). The symptom is
      real: /_framework/blazor.web.js returns 404 to an authenticated request, so
      no circuit starts; anonymous requests get 302 from auth redirect before
      routing reaches the 404. It is NOT a Docker problem — the published output
      behaves identically outside Docker and the container manifest has 70
      endpoints, matching a local publish. It is NOT the flattened intermediate
      `dotnet build -o` step in the Dockerfile; removing that changed nothing and
      it was reverted. It is NOT a missing MapStaticAssets() on its own; added,
      rebuilt, still 404, reverted. The manifest contains ZERO _framework routes
      (70 endpoints, all _content/*, css/*, favicon*), and AssetHub.Api.styles.css
      is likewise absent, yet App.razor references both. App.razor is a correct
      .NET 8+ Blazor Web App head. blazor.web.js exists nowhere on disk in SDK or
      container — it is framework-embedded, so the real question is why its route
      is never registered.

      TWO MEASUREMENT ERRORS OF MINE, both caught and corrected mid-investigation:
      `grep -c Route` counted lines in minified JSON and reported 1 endpoint where
      there were 70, which sent the Docker hypothesis down a blind alley; and the
      first 302-vs-404 comparison used different Host headers, later re-run
      controlled. The first error is the more instructive: a measurement artefact
      became a diagnosis, and a change was made on its strength.

      The redraw should start from the manifest question — why the Razor SDK
      contributes no _framework or scoped-CSS assets for this Api-hosts-RCL
      layout — rather than from a proposed fix.

  - contract_id: contract-017
    feature: restore-host-owns-its-document
    date_proposed: 2026-08-16
    date_approved: 2026-08-16
    supersedes: contract-016
    tier_1: |
      Redraw of stopped contract-016, now grounded in a traced root cause.

      blazor.web.js ships in the NuGet package Microsoft.AspNetCore.App.Internal.Assets,
      which the SDK adds IMPLICITLY and ONLY when a Web project contains Razor
      content. AssetHub.Api contains zero .razor files — all 70 live in the
      AssetHub.Ui RCL, App.razor included — so the SDK never classified the host
      as a Blazor app and never published its client assets. Proven by three
      controlled builds: reference template (host owns components) -> asset
      present; minimal Web host + RCL with no own components -> absent,
      reproducing the bug exactly; same host plus one trivial .razor -> present.

      The fix is structural. The SDK rule encodes a real assumption: a host owns
      its own document. App.razor IS hosting — head, script tags, asset links,
      render-mode declarations — and it currently lives in a library. Moving it
      back restores that ownership; the SDK behaviour follows as a consequence
      rather than as the goal.

      The one-line alternative (explicit PackageReference to that package) was
      TESTED and works, including on the real project — and is recommended
      AGAINST: the package name announces it is not a public contract, it needs a
      version pin, and adopting it would leave in place the drift-from-tooling-
      assumptions that produced a silent failure.

      The RCL stays. AssetHub.Ui references only AssetHub.Application — the
      compiler-enforced boundary keeping UI off Infrastructure. App.razor does
      not reference Infrastructure, so moving it costs that rule nothing.

      A guard is part of the contract, not an extra. This broke silently and
      stayed broken: green build, 909 passing tests, correct server-rendered
      HTML, a working /_blazor hub — every signal healthy while no user could
      click anything.
    tier_2: |
      1. Baseline roll-forward to be40d17 (909); docker pre-check first.
      2. Move App.razor to AssetHub.Api; add a host _Imports.razor carrying only
         what the document needs, NOT a copy of the RCL's 34-line list.
      3. Move Routes.razor alongside it. AppAssembly becomes typeof(Program).Assembly
         plus AdditionalAssemblies naming the Ui assembly. ROUTING MUST NOT CHANGE
         — all 16 routable pages resolve exactly as before.
      4. Update MapRazorComponents<App>() resolution and the RCL _Imports where it
         references AssetHub.Ui.App.
      5. Verify SDK classification: Microsoft.AspNetCore.App.Internal.Assets appears
         as a resolved dependency of AssetHub.Api, and publish emits
         wwwroot/_framework/blazor.web.js.
      6. Scoped CSS: confirm AssetHub.Api.styles.css generates and serves; if the
         bundle is still absent (RCL has zero .razor.css), remove the dangling link
         rather than leave a known 404.
      7. REGRESSION GUARD: automated assertion that /_framework/blazor.web.js
         returns 200 with an executable content type, placed so it runs without a
         browser if possible.
      8. Sweep: _Imports duplication, stale @using AssetHub.Ui references, anything
         assuming the document lives in the library.
    tier_3: |
      - /_framework/blazor.web.js returns 200 with an executable content type IN
        THE CONTAINER, and window.Blazor exists in a real browser.
      - A MENU OPENS — the thing that has never worked in Docker.
      - All 16 routable pages resolve at their existing URLs; enumerated, not
        spot-checked.
      - E2E green including the two circuit-dependent tests that currently fail.
      - The regression guard fails if the script 404s — verified by deliberately
        breaking it once.
      - Unit suite unchanged at 909 with zero assertion edits.
      - AssetHub.Ui still references only AssetHub.Application.
      - No dependency on Microsoft.AspNetCore.App.Internal.Assets in any csproj.
      - Census no new rules; both compose files parse.
      - Owner asked for a VERIFY PASS after implementation.
    status: implemented
    implemented: 2026-08-16
    commit: d9a977a
    revisions: []
    work_id: null
    outcome: |
      Acceptance met. Suite 909 -> 911 (2 guards added, 0 removed, 0 regressions,
      reconciled by test-name set). @auth E2E 15/15 including both tests that
      failed before this contract. Container: blazor.web.js 200 text/javascript
      200645 bytes; published manifest _framework routes 0 -> 12, endpoints
      70 -> 90; all 16 routes resolve (anonymous render 200, authorized redirect
      to /login). Both guards proven to fail when their own fix is reverted.
      No csproj references Microsoft.AspNetCore.App.Internal.Assets — it arrives
      implicitly, which was the point.

      TIER_2 STEP 3 FAILED AS THE CONTRACT PREDICTED IT MIGHT. Moving App.razor
      silently broke authorization on every page: MapRazorComponents<App>()
      discovers routable pages from App's assembly, so the RCL had to be named
      via .AddAdditionalAssemblies() — a DIFFERENT knob from
      Router.AdditionalAssemblies. Build clean, 910 tests green, /login redirecting
      to itself. Caught only because "all 16 pages resolve, enumerated" was written
      into tier_3 for exactly this reason.

      MY OWN VERIFICATION TOOL CERTIFIED THE BREAKAGE AS HEALTHY. The route probe
      scored any 302 as "resolved", which is right for [Authorize] pages and exactly
      backwards for the four anonymous ones, so a blanket 302 across all 16 routes
      printed ALL CHECKS PASSED against a redirect loop. Caught only by comparing
      /login against a before-picture captured from the pre-fix container. Third
      measurement artefact of this programme (grep -c on minified JSON; head -3
      truncation; now vacuous-302) and further evidence for the pending
      pattern-invariant-capture-and-diff elevation.

      SIDE EFFECT, REAL AND USER-FACING: the login page hydrates for the first
      time, and hydration discards input typed before it completes. Waiting on
      window.Blazor is NOT a valid signal — it is defined as soon as the script
      parses. E2E now verifies the typed values survived. Root fix is static SSR
      for the auth forms — contract-018.

      FULL E2E SWEEP (first ever): 63 passed, ~32 failed, 3 skipped, 49 did-not-run
      (serial-block short-circuits; workers=1). NOT an 017 regression — sampled
      failure waits on getByRole('tab', name:/user/i), an admin tab bar the reshape
      deliberately removed in favour of routable /admin/* sub-pages. The E2E suite
      is stale against 11 feature cuts and needs its own truth pass. Recorded here
      as the baseline contract-018 measures against, with that caveat attached.

  - contract_id: contract-018
    feature: static-render-the-auth-forms
    date_proposed: 2026-08-16
    date_approved: 2026-08-16
    follows: contract-017
    tier_1: |
      contract-017 made the app interactive in the container for the first time,
      which exposed a real defect: the login page discards input typed before
      hydration. Measured two-arm — filling on domcontentloaded leaves both fields
      empty; filling after hydration retains both. A user typing quickly loses
      their username, and because `required` then blocks the POST they get no
      error, just a form that does nothing.

      Cause is a mismatch. Routes carried a global InteractiveServer render mode,
      making EVERY page interactive — including a login form that is deliberately a
      plain HTML POST, because establishing an auth cookie needs a real HTTP
      response, which a circuit cannot produce. The one page that gains nothing
      from interactivity paid its full cost.

      A retry-and-refill loop in the E2E page object was compensating. That
      workaround is a test papering over a product defect; its removal is part of
      this contract, not a follow-up.

      Not introduced by contract-017 so much as revealed by it — the page was never
      interactive before, so the race could not fire. That does not make it less real.
    tier_2: |
      1. Baseline roll-forward to d9a977a (911); docker pre-check.
      2. Gate the render mode in App.razor on HttpContext.AcceptsInteractiveRouting(),
         applying the same mode to HeadOutlet so head and body agree.
      3. ExcludeFromInteractiveRouting on Login.razor and ResetPassword.razor.
      4. Keep the chrome honest on statically-rendered pages.
      5. DELETE the E2E retry loop; a plain fill is the proof.
      6. Confirm surviving interactive pages are unaffected.
    tier_3: |
      - A plain fill on /login with no retry and no hydration wait signs in reliably.
      - /login and /reset-password serve no circuit; every other page still does.
      - Sign-in, sign-out and password reset work end-to-end in the container.
      - E2E green: at-auth 15/15, no spec regresses against the contract-017 sweep
        (63 passed / ~32 failed / 3 skipped / 49 did-not-run — stale specs from the
        reshape, recorded with that caveat).
      - Unit suite unchanged at 911 with zero assertion edits; both contract-017
        guards still pass.
      - No page loses interactivity it needs — enumerated, not spot-checked.
    status: implemented
    implemented: 2026-08-16
    revisions:
      - date: 2026-08-16
        note: >-
          Tier_2 step 4 was drawn as "give those pages a minimal auth layout".
          Two measurements changed the design during implementation. First, static
          rendering makes the LAYOUT inert too, and LanguageSwitcher is a MudMenu
          driven by JS interop — shipping the plan as drawn would have silently
          removed language switching from the sign-in page of a bilingual app.
          Second, MainLayout and ShareLayout palettes were compared and found to
          DIFFER, so a new auth layout meant a third divergent copy rather than a
          reuse. Implemented instead as: MainLayout branches on
          RendererInfo.IsInteractive, rendering a form-POST StaticLanguageSwitcher
          (new /auth/culture endpoint, culture validated against the supported
          list, redirect guarded by UrlSafetyHelper which gains a /reset-password
          prefix) where the interactive control cannot work; the dark-mode toggle
          is hidden rather than shipped inert (the theme cookie still applies); the
          Sign In button moves from OnClick to Href so it works in both modes,
          which made MainLayout.Login() dead and it was removed.
          Capability preserved rather than silently dropped; no new layout, no
          palette duplication.
    work_id: null
    outcome: |
      Acceptance met. Hydration race gone: filling /login IMMEDIATELY after
      domcontentloaded now retains both fields (was empty/empty). @auth E2E 15/15
      with a plain fill — no retry, no hydration wait — and the run halved from
      29.2s to 15.5s once the workaround was deleted. Unit suite 911 unchanged
      (0 added, 0 removed, 0 regressions); both contract-017 guards still pass.

      Interactivity ENUMERATED across all 16 routes against an authenticated
      session: exactly /login and /reset-password are static, the other 14 keep
      their circuit. Language switching preserved on the static pages and verified
      end-to-end (POST /auth/culture -> "Logga in"), including its guards —
      off-site returnUrl redirects to "/", unsupported culture falls back.

      Full E2E sweep 63 passed / 3 skipped / 49 did-not-run — identical counts to
      the contract-017 baseline with an identical failure tail. Claim of "no
      regression" rests on matching counts + matching tail, NOT on a full failure-set
      diff; the baseline run's per-test list was not captured in machine-readable

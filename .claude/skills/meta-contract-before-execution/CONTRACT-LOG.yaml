  - contract_id: contract-010
    feature: reshape-c9-metadata-schema-engine-cut
    date_proposed: 2026-08-13
    date_approved: 2026-08-13
    tier_1: |
      You are removing the admin-defined metadata engine: schemas, typed fields,
      taxonomies with hierarchical terms, and the per-asset typed values they
      produce. What survives is the metadata people actually see on an asset —
      Tags (free-form, faceted, searchable) and MetadataJson (technical metadata
      extracted from the file: EXIF, dimensions, duration). Full-text search, the
      tag facet, asset-type/status/collection facets, and saved searches are
      untouched. "Metadata & search" is one of the five kept features; the
      judgment is that the schema engine is the enterprise-DAM apparatus AROUND
      metadata, not metadata itself.

      Named consequence, owner-approved: AssetMetadataEndpoints is a PUBLIC API
      surface — GET /api/v1/assets/{id}/metadata, PUT .../metadata, and POST
      /api/v1/assets/bulk-metadata, all scope-guarded. Every one keys on
      MetadataFieldId, so all three die with the engine. This is a read/write
      pair plus a bulk mutation leaving the documented contract — a larger SemVer
      event than any prior cut, and the one place the reshape removes a
      capability an external integrator could genuinely depend on. Accepted as a
      programme-level decision; the replacement is tags, which is NOT equivalent
      and must be stated as such rather than implied. The rejected alternative
      (keep the routes as a thin JSONB read/write over Asset.MetadataJson) was
      argued against: same URL with different meaning is worse than clean removal.

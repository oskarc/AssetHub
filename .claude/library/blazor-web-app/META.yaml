  - Most pre-build nodes are thin — extracted 2026-06 from the source project's instructions and not yet exercised standalone against a fresh system of this category
  - Four mature check skills (ux-check, di-check, add-tests, commit-and-push) still mix type-category and project-shaped content — decomposition candidates

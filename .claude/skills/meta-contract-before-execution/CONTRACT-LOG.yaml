      custom logos and colors on share pages — and magic-link guest invitations —
      externally provisioned, auto-expiring viewer accounts — are both polish on top of
      sharing, not part of what this product is. Share pages go back to the one clean
      unbranded layout; external people access content the one simple way: a share
      link. Everything core still works exactly as today — including creating shares,
      share passwords, and expiry. If this doesn't happen, the repo keeps ~7,600
      lines, two admin sections, an email flow, and an identity-provisioning pathway
      for capabilities outside the five features.
    tier_2: |
      1. Baseline roll-forward to the green state at 6dd7a0e.
      2. Remove Brands: entity + Collection.BrandId column, endpoints/DTOs/repo/
         service/resolver, admin page + tab + three dialogs, BrandHeader on the share
         page, Brand fields on shared-content DTOs and their IBrandResolver population,
         facade partial + members, BrandsResource pair. Edge: brand logo objects in
         MinIO stay behind (excluded from tombstone path per A-4) — operator note.
      3. Remove Guests: entity, endpoints/DTOs/repo/services (invitation + token),
         the email template (email infrastructure stays), /guest-accept page, admin
         page + tab + two dialogs, Worker hourly expiry sweep + registration,
         GuestInvitationProtector, facade partial + members, GuestsResource pair.
         Edges: provisioned guest accounts remain in Keycloak as ordinary viewers
         (accepted remnant; pathway dies in C12); ShareAnonymous rate-limit policy
         stays (share endpoints still use it).
      4. Data model: one generated migration dropping Brands + GuestInvitations
         tables and Collection.BrandId (+ FK/index). Both Add migrations EF-discovered
         (Designers verified) — plain drops; data loss documented.
      5. Touchpoint edits across the 29 surveyed files (navs — no group death;
         breadcrumbs; DbContext; DI; imports/markers; admin DTOs; notification
         constants if guest-specific; audit-resource keys kept only if they label
         historical audit rows). False positives left alone: RabbitMQ guest
         credentials, unrelated brand mentions.
      6. Tests: five named classes deleted; guest/brand cases in shared specs and
         factories edited; E2E 01-auth/02-navigation guest scenarios edited, files
         kept.
      7. Prove nothing else moved: residual sweep (brand|guest|magic-link|
         BrandHeader|GuestInvitation) over src/tests/docs/docker; expected survivors:

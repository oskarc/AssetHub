description: A standard for server-rendered component-UI web applications on .NET — layered architecture with thin composition roots, result-based error flow, curated public API surface, two-tier caching, worker/background conventions, and a post-build verification suite.
status: stable

covers:
  - Layered .NET architecture & dependency direction
  - Encoding twice-regressed rules as types/helpers over documentation
  - Navigation & information-architecture decisions
  - Service-layer error reporting (ServiceResult)
  - Public API contract & SemVer
  - API token auth & scope enforcement
  - Splitting large-but-cohesive types along seams
  - Enum string persistence
  - Two-tier caching with central registry
  - Pre-implementation interrogation (brainstorm)
  - Debugging workflow
  - Commit splitting decision
  - Test regression isolation
  - Time-bounded aggregate persistence (rollup)
  - PII grouping with audited reveal
  - C# coding conventions
  - Component-UI standard (facade, error idiom, optimistic vs confirmed)
  - Worker handlers & background services
  - EF model config & migration safety
  - Configuration & secrets discipline
  - Test structure conventions
  - Container & compose conventions
  - Static-analysis suppression discipline
  - Accessibility audit (WCAG 2.2 AA)
  - UX heuristics audit
  - Localisation parity audit
  - DI consistency audit
  - Migration safety audit
  - Test scaffolding
  - E2E coverage mapping
  - Commit hygiene

